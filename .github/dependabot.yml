version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      development-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-patch:
        dependency-type: production
        update-types:
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - maintenance