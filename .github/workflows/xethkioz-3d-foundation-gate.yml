name: Xethkioz 3D Foundation Gate

on:
  workflow_dispatch:
  push:
    branches:
      - 'game/xethkioz-3d-vertical-slice'
    paths:
      - 'project.godot'
      - 'src/3d/**'
      - 'scenes/3d/**'
      - 'tools/xethkioz_3d_foundation_smoke.gd'
      - 'tools/scenes/Xethkioz3DFoundationSmoke.tscn'
      - '.github/workflows/xethkioz-3d-foundation-gate.yml'

concurrency:
  group: xethkioz-3d-foundation-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  foundation-3d:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project and reject parser regressions
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/xethkioz-3d-import.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/xethkioz-3d-import.log; then
            exit 1
          fi

      - name: Validate 3D movement camera interaction and save adapter
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/Xethkioz3DFoundationSmoke.tscn 2>&1 | tee /tmp/xethkioz-3d-foundation.log
          grep -q "XETHKIOZ_3D_FOUNDATION_PASS" /tmp/xethkioz-3d-foundation.log

      - name: Upload 3D foundation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xethkioz-3d-foundation-logs
          path: |
            /tmp/xethkioz-3d-import.log
            /tmp/xethkioz-3d-foundation.log
          if-no-files-found: warn
