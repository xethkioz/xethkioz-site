name: Temporary Huellas CLS Hardening

on:
  push:
    branches:
      - fix/telemetry-failsafe-20260808

permissions:
  contents: write

jobs:
  stabilize-huellas:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/telemetry-failsafe-20260808
          fetch-depth: 0
      - name: Remove runtime header mutation and bake stable layout into HTML
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('public/mascotas/app-core.js')
          source = core.read_text()
          marker = '\n// Encabezado de Huellas: distribución independiente del ancho del contenido.'
          if marker not in source:
              raise SystemExit('Expected runtime header marker not found')
          source = source.split(marker, 1)[0].rstrip() + '\n'
          core.write_text(source)

          page = Path('public/mascotas/index.html')
          html = page.read_text()
          marker_css = '/* HUELLAS_STABLE_HEADER_V2 */'
          if marker_css not in html:
              stable = r'''
/* HUELLAS_STABLE_HEADER_V2 */
.top .header-row{width:min(1480px,calc(100% - 32px));max-width:none;margin:0 auto;display:grid;grid-template-columns:1fr max-content;grid-template-rows:auto auto;align-items:center;gap:6px 18px;padding:10px 0 8px;min-height:0;overflow:visible}
.top .brand{grid-column:1;grid-row:1;min-width:0;justify-self:start;position:relative;z-index:2}
.top .back{grid-column:2;grid-row:1;justify-self:end;flex:none;padding:9px 14px;font-size:.82rem}
.top .nav{grid-column:1/-1;grid-row:2;width:100%;min-width:0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;margin:0;padding:2px 0 0;overflow:visible;scroll-behavior:auto}
.top .nav button{flex:0 0 auto;white-space:nowrap;padding:8px 10px;font-size:.84rem}
@media(max-width:900px){.top .nav{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}.top .nav::-webkit-scrollbar{display:none}}
@media(max-width:600px){.top .header-row{width:calc(100% - 20px);padding:8px 0 6px}.top .brand-mark{font-size:27px}.top .brand-text strong{font-size:1.12rem}.top .brand-text small{font-size:.74rem}.top .back{font-size:.7rem;padding:7px 9px}.top .nav button{font-size:.78rem;padding:8px 9px}}
'''
              if '</style>' not in html:
                  raise SystemExit('Initial style close tag not found')
              html = html.replace('</style>', stable + '\n</style>', 1)
          page.write_text(html)
          PY
      - name: Verify no late header CSS injection remains
        run: |
          ! grep -q 'Encabezado de Huellas: distribución independiente' public/mascotas/app-core.js
          ! grep -q 'document.head.appendChild(headerStyle)' public/mascotas/app-core.js
          ! grep -q 'installStableHeader' public/mascotas/app.js
          grep -q 'HUELLAS_STABLE_HEADER_V2' public/mascotas/index.html
      - name: Commit generated stabilization and remove temporary workflow
        run: |
          rm .github/workflows/huellas-cls-hardening-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/mascotas/index.html public/mascotas/app-core.js .github/workflows/huellas-cls-hardening-temp.yml
          git commit -m 'perf(huellas): stabilize initial header layout'
          git push origin HEAD:fix/telemetry-failsafe-20260808
