name: Temporary Home Contact Update

on:
  push:
    branches:
      - feat/home-direct-contact-20260808

permissions:
  contents: write

jobs:
  patch-home-contact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/home-direct-contact-20260808
          fetch-depth: 0

      - name: Add contact section and responsive styles
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('src/pages/Home.tsx')
          source = home.read_text()
          anchor = '''          <WebCreationFeature\n            eyebrow={t.webEyebrow}\n            title={t.webTitle}\n            text={t.webText}\n            cta={t.webCta}\n            featuredLabel={t.featured}\n            offer={featuredWebOffer}\n          />\n\n          <footer className="xk-rb-footer">'''
          replacement = '''          <WebCreationFeature\n            eyebrow={t.webEyebrow}\n            title={t.webTitle}\n            text={t.webText}\n            cta={t.webCta}\n            featuredLabel={t.featured}\n            offer={featuredWebOffer}\n          />\n\n          <section className="xk-rb-contact" aria-labelledby="home-contact-title">\n            <div className="xk-rb-contact-copy">\n              <p>{lang === 'es' ? 'XETHKIOZ // CONTACTO DIRECTO' : 'XETHKIOZ // DIRECT CONTACT'}</p>\n              <h2 id="home-contact-title">{lang === 'es' ? '¿Tenés una idea, consulta o proyecto?' : 'Have an idea, question or project?'}</h2>\n              <span>{lang === 'es' ? 'Escribime por el canal que te resulte más cómodo.' : 'Reach me through whichever channel works best for you.'}</span>\n            </div>\n\n            <div className="xk-rb-contact-links">\n              <a href="https://www.instagram.com/xethkioz" target="_blank" rel="noopener noreferrer" aria-label="Instagram de XETHKIOZ">\n                <span>Instagram</span>\n                <strong>@xethkioz</strong>\n                <b aria-hidden="true">↗</b>\n              </a>\n              <a href="mailto:Xethkioz@gmail.com" aria-label="Enviar correo a XETHKIOZ">\n                <span>{lang === 'es' ? 'Correo electrónico' : 'Email'}</span>\n                <strong>Xethkioz@gmail.com</strong>\n                <b aria-hidden="true">↗</b>\n              </a>\n              <a href="https://wa.me/5492923483054" target="_blank" rel="noopener noreferrer" aria-label="Contactar a XETHKIOZ por WhatsApp">\n                <span>WhatsApp</span>\n                <strong>2923 483054</strong>\n                <b aria-hidden="true">↗</b>\n              </a>\n            </div>\n          </section>\n\n          <footer className="xk-rb-footer">'''
          if anchor not in source:
              raise SystemExit('Home contact insertion anchor not found')
          if 'xk-rb-contact' in source:
              raise SystemExit('Home contact section already exists')
          home.write_text(source.replace(anchor, replacement, 1))

          css = Path('src/pages/HomeReborn.css')
          styles = css.read_text()
          css_anchor = '.xk-rb-footer{position:relative;z-index:5;border-top:1px solid rgba(255,255,255,.08);'
          contact_css = '''.xk-rb-contact{position:relative;z-index:5;display:grid;grid-template-columns:minmax(260px,.72fr) minmax(0,1.28fr);align-items:center;gap:clamp(1.2rem,3vw,3rem);margin:2rem 0 3rem;padding:clamp(1.25rem,3vw,2.3rem);border:1px solid rgba(139,92,246,.24);border-radius:1.6rem;background:linear-gradient(120deg,rgba(139,92,246,.1),rgba(5,5,10,.76) 46%,rgba(255,107,26,.08));box-shadow:0 26px 72px rgba(0,0,0,.34)}\n.xk-rb-contact-copy p{margin:0;font:1000 .52rem/1 ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase;color:#bda5ff}.xk-rb-contact-copy h2{margin:.72rem 0 0;font:1000 clamp(1.55rem,2.8vw,3rem)/.96 Orbitron,Inter,sans-serif;letter-spacing:-.045em}.xk-rb-contact-copy span{display:block;margin-top:.8rem;max-width:520px;font-size:.79rem;line-height:1.6;color:rgba(255,255,255,.58)}\n.xk-rb-contact-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}.xk-rb-contact-links a{position:relative;display:grid;align-content:center;min-height:116px;padding:1rem 2.3rem 1rem 1rem;border:1px solid rgba(255,255,255,.11);border-radius:1rem;background:rgba(3,3,8,.58);text-decoration:none;color:#fff;transition:.25s ease}.xk-rb-contact-links a:hover,.xk-rb-contact-links a:focus-visible{outline:none;transform:translateY(-3px);border-color:rgba(255,140,66,.55);box-shadow:0 18px 36px rgba(0,0,0,.32),0 0 24px rgba(139,92,246,.16)}.xk-rb-contact-links span{font:900 .47rem/1 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.48)}.xk-rb-contact-links strong{margin-top:.55rem;overflow-wrap:anywhere;font-size:.82rem;line-height:1.35;color:#fff}.xk-rb-contact-links b{position:absolute;right:1rem;top:50%;transform:translateY(-50%);font-size:1rem;color:#ff9b5b}\n'''
          if css_anchor not in styles:
              raise SystemExit('Footer CSS anchor not found')
          if '.xk-rb-contact{' in styles:
              raise SystemExit('Home contact styles already exist')
          styles = styles.replace(css_anchor, contact_css + css_anchor, 1)
          mobile_anchor = '@media (max-width:760px){.xk-rb-shell{padding-inline:1rem;padding-bottom:4rem}'
          mobile_replacement = '@media (max-width:760px){.xk-rb-shell{padding-inline:1rem;padding-bottom:4rem}.xk-rb-contact{grid-template-columns:1fr;margin-block:1.6rem 2.3rem;padding:1rem;border-radius:1.2rem}.xk-rb-contact-links{grid-template-columns:1fr}.xk-rb-contact-links a{min-height:88px}'
          if mobile_anchor not in styles:
              raise SystemExit('Mobile CSS anchor not found')
          styles = styles.replace(mobile_anchor, mobile_replacement, 1)
          css.write_text(styles)
          PY

      - name: Verify contact contract
        run: |
          grep -q 'xk-rb-contact' src/pages/Home.tsx
          grep -q 'https://www.instagram.com/xethkioz' src/pages/Home.tsx
          grep -q 'mailto:Xethkioz@gmail.com' src/pages/Home.tsx
          grep -q 'https://wa.me/5492923483054' src/pages/Home.tsx
          grep -q '.xk-rb-contact{' src/pages/HomeReborn.css
          grep -q '.xk-rb-contact-links{grid-template-columns:1fr}' src/pages/HomeReborn.css

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/home-contact-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Home.tsx src/pages/HomeReborn.css .github/workflows/home-contact-temp.yml
          git commit -m 'feat(home): add direct contact links'
          git push origin HEAD:feat/home-direct-contact-20260808
