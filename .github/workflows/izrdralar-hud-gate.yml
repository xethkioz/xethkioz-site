name: Izrdralar HUD Accessibility Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/ui/hud_controller*.gd'
      - 'src/ui/izrdralar_pause_menu.gd'
      - 'src/ui/izrdralar_onboarding_guide.gd'
      - 'src/core/game_state.gd'
      - 'src/core/accessibility_service.gd'
      - 'src/player/player_controller_production.gd'
      - 'src/world/izrdralar_m01_m05_runtime_visual_pass10.gd'
      - 'tools/izrdralar_hud_accessibility_smoke.gd'
      - 'tools/izrdralar_pause_menu_smoke.gd'
      - 'tools/izrdralar_onboarding_smoke.gd'
      - 'tools/scenes/IzrdralarHudAccessibilitySmoke.tscn'
      - 'tools/scenes/IzrdralarPauseMenuSmoke.tscn'
      - 'tools/scenes/IzrdralarOnboardingSmoke.tscn'
      - '.github/workflows/izrdralar-hud-gate.yml'

concurrency:
  group: izrdralar-hud-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  hud-accessibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project and reject parser regressions
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/hud-import.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/hud-import.log; then
            exit 1
          fi

      - name: Compact HUD numeric accessibility smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarHudAccessibilitySmoke.tscn 2>&1 | tee /tmp/hud-smoke.log
          grep -q "IZRDRALAR_HUD_ACCESSIBILITY_PASS" /tmp/hud-smoke.log

      - name: Pause menu open close smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarPauseMenuSmoke.tscn 2>&1 | tee /tmp/pause-smoke.log
          grep -q "IZRDRALAR_PAUSE_MENU_PASS" /tmp/pause-smoke.log

      - name: M01 control onboarding smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarOnboardingSmoke.tscn 2>&1 | tee /tmp/onboarding-smoke.log
          grep -q "IZRDRALAR_ONBOARDING_PASS" /tmp/onboarding-smoke.log

      - name: Upload HUD gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izrdralar-hud-accessibility-gate-logs
          path: |
            /tmp/hud-import.log
            /tmp/hud-smoke.log
            /tmp/pause-smoke.log
            /tmp/onboarding-smoke.log
          if-no-files-found: warn
