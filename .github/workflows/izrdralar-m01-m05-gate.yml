name: Izrdralar M01-M05 Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/regions/izrdralar_m01_m05_*.json'
      - 'data/visual/izrdralar_m01_m05_visual_contract.json'
      - 'scenes/izrdralar/**'
      - 'src/core/**'
      - 'src/fx/**'
      - 'src/player/**'
      - 'src/npc/**'
      - 'src/pets/**'
      - 'src/world/izrdralar_*'
      - 'tools/izrdralar_*'
      - '.github/workflows/izrdralar-m01-m05-gate.yml'
  push:
    branches:
      - feat/izrdralar-m01-m05-save-visual-contract

concurrency:
  group: izrdralar-m01-m05-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-4-7-2-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project and reject parse errors
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/izrdralar-import.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/izrdralar-import.log; then
            exit 1
          fi

      - name: Check production scripts
        shell: bash
        run: |
          set -uo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          : > /tmp/izrdralar-script-check.log
          SCRIPTS=(
            res://src/core/game_state.gd
            res://src/core/save_service.gd
            res://src/fx/izrdralar_fx_factory.gd
            res://src/fx/world_feedback_fx.gd
            res://src/player/player_controller_production.gd
            res://src/npc/enemy_controller_production.gd
            res://src/npc/boss5_guardian_production.gd
            res://src/pets/xethkioz_companion_production.gd
            res://src/world/izrdralar_navigation_graph.gd
            res://src/world/izrdralar_map_transition.gd
            res://src/world/izrdralar_entry_point.gd
            res://src/world/izrdralar_checkpoint_tracker.gd
            res://src/world/izrdralar_route_objective.gd
            res://src/world/izrdralar_generic_chunk.gd
            res://src/world/izrdralar_m01_m05_runtime.gd
          )
          FAILED=0
          for SCRIPT in "${SCRIPTS[@]}"; do
            echo "===== CHECK $SCRIPT =====" | tee -a /tmp/izrdralar-script-check.log
            set +e
            "$GODOT" --headless --path . --check-only --script "$SCRIPT" 2>&1 | tee -a /tmp/izrdralar-script-check.log
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -ne 0 ]; then
              echo "FAILED $SCRIPT status=$STATUS" | tee -a /tmp/izrdralar-script-check.log
              FAILED=1
            else
              echo "PASS $SCRIPT" | tee -a /tmp/izrdralar-script-check.log
            fi
          done
          exit "$FAILED"

      - name: Visual contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --script res://tools/izrdralar_visual_contract_smoke.gd 2>&1 | tee /tmp/izrdralar-visual.log
          grep -q "IZRDRALAR_VISUAL_CONTRACT_PASS" /tmp/izrdralar-visual.log

      - name: Navigation graph smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --script res://tools/izrdralar_navigation_smoke.gd 2>&1 | tee /tmp/izrdralar-navigation.log
          grep -q "IZRDRALAR_M01_M05_NAVIGATION_PASS" /tmp/izrdralar-navigation.log

      - name: Save v10 and backup recovery smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --script res://tools/izrdralar_save_v10_smoke.gd 2>&1 | tee /tmp/izrdralar-save.log
          grep -q "IZRDRALAR_SAVE_V10_PASS" /tmp/izrdralar-save.log

      - name: Authored M01-M05 runtime smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --script res://tools/izrdralar_m01_m05_runtime_smoke.gd 2>&1 | tee /tmp/izrdralar-authored-runtime.log
          grep -q "IZRDRALAR_M01_M05_RUNTIME_PASS" /tmp/izrdralar-authored-runtime.log

      - name: Current main runtime startup without timeout-as-pass
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --quit-after 120 2>&1 | tee /tmp/izrdralar-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/izrdralar-runtime.log; then
            exit 1
          fi

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izrdralar-m01-m05-gate-logs
          path: |
            /tmp/izrdralar-import.log
            /tmp/izrdralar-script-check.log
            /tmp/izrdralar-visual.log
            /tmp/izrdralar-navigation.log
            /tmp/izrdralar-save.log
            /tmp/izrdralar-authored-runtime.log
            /tmp/izrdralar-runtime.log
          if-no-files-found: warn
