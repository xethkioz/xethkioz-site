name: Izrdralar M01-M05 Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/production/characters/**'
      - 'assets/production/izrdralar/**'
      - 'data/regions/izrdralar_m01_m05_*.json'
      - 'data/visual/izrdralar_m01_m05_visual_contract.json'
      - 'scenes/izrdralar/**'
      - 'scenes/v34/GameBootstrap.tscn'
      - 'src/core/**'
      - 'src/fx/**'
      - 'src/player/**'
      - 'src/npc/**'
      - 'src/pets/**'
      - 'src/ui/game_bootstrap*.gd'
      - 'src/world/izrdralar_*'
      - 'tools/izrdralar_*'
      - 'tools/scenes/**'
      - '.github/workflows/izrdralar-m01-m05-gate.yml'

concurrency:
  group: izrdralar-m01-m05-pr-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  godot-4-7-2-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project and reject parse errors
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/izrdralar-import.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/izrdralar-import.log; then
            exit 1
          fi

      - name: Load production resources in project context
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarVisualContractSmoke.tscn 2>&1 | tee /tmp/izrdralar-visual.log
          grep -q "IZRDRALAR_VISUAL_CONTRACT_PASS" /tmp/izrdralar-visual.log

      - name: Eight-direction Viajero animation smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarDirectionalAnimationSmoke.tscn 2>&1 | tee /tmp/izrdralar-directional.log
          grep -q "IZRDRALAR_DIRECTIONAL_ANIMATION_PASS" /tmp/izrdralar-directional.log

      - name: Xethkioz facing direction smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarXethkiozDirectionSmoke.tscn 2>&1 | tee /tmp/izrdralar-xethkioz-direction.log
          grep -q "IZRDRALAR_XETHKIOZ_DIRECTION_PASS" /tmp/izrdralar-xethkioz-direction.log

      - name: Eight-direction melee hit smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarMeleeDirectionSmoke.tscn 2>&1 | tee /tmp/izrdralar-melee.log
          grep -q "IZRDRALAR_MELEE_DIRECTION_PASS" /tmp/izrdralar-melee.log

      - name: Enemy and Boss telegraph timing smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarTelegraphTimingSmoke.tscn 2>&1 | tee /tmp/izrdralar-telegraph-timing.log
          grep -q "IZRDRALAR_TELEGRAPH_TIMING_PASS" /tmp/izrdralar-telegraph-timing.log

      - name: Navigation graph smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarNavigationSmoke.tscn 2>&1 | tee /tmp/izrdralar-navigation.log
          grep -q "IZRDRALAR_M01_M05_NAVIGATION_PASS" /tmp/izrdralar-navigation.log

      - name: Save v10 and backup recovery smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarSaveV10Smoke.tscn 2>&1 | tee /tmp/izrdralar-save.log
          grep -q "IZRDRALAR_SAVE_V10_PASS" /tmp/izrdralar-save.log

      - name: Authored M01-M05 runtime smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarM01M05RuntimeSmoke.tscn 2>&1 | tee /tmp/izrdralar-authored-runtime.log
          grep -q "IZRDRALAR_M01_M05_RUNTIME_PASS" /tmp/izrdralar-authored-runtime.log

      - name: Biome ground texture smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarGroundTextureSmoke.tscn 2>&1 | tee /tmp/izrdralar-ground-texture.log
          grep -q "IZRDRALAR_GROUND_TEXTURE_PASS" /tmp/izrdralar-ground-texture.log

      - name: M03 lake collision and visual shoreline alignment smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarLakeCollisionVisualSmoke.tscn 2>&1 | tee /tmp/izrdralar-lake-alignment.log
          grep -q "IZRDRALAR_LAKE_COLLISION_VISUAL_PASS" /tmp/izrdralar-lake-alignment.log

      - name: M01-M05 progression and Boss 5 flow smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarM01M05FlowSmoke.tscn 2>&1 | tee /tmp/izrdralar-flow.log
          grep -q "IZRDRALAR_M01_M05_FLOW_PASS" /tmp/izrdralar-flow.log

      - name: M01-M04 canonical story continuity smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarStoryContinuitySmoke.tscn 2>&1 | tee /tmp/izrdralar-story.log
          grep -q "IZRDRALAR_STORY_CONTINUITY_PASS" /tmp/izrdralar-story.log

      - name: Exact-position autosave smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarAutosaveSmoke.tscn 2>&1 | tee /tmp/izrdralar-autosave.log
          grep -q "IZRDRALAR_AUTOSAVE_PASS" /tmp/izrdralar-autosave.log

      - name: Authored checkpoint respawn smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarRespawnSmoke.tscn 2>&1 | tee /tmp/izrdralar-respawn.log
          grep -q "IZRDRALAR_RESPAWN_PASS" /tmp/izrdralar-respawn.log

      - name: Production bootstrap integration smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarBootstrapIntegrationSmoke.tscn 2>&1 | tee /tmp/izrdralar-bootstrap.log
          grep -q "IZRDRALAR_BOOTSTRAP_INTEGRATION_PASS" /tmp/izrdralar-bootstrap.log

      - name: Capture authored runtime 640x360
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          rm -rf /tmp/izrdralar-captures
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi
          timeout 60s xvfb-run -a "$GODOT" --path . --rendering-method gl_compatibility res://tools/scenes/IzrdralarRuntimeCapture.tscn 2>&1 | tee /tmp/izrdralar-capture.log
          grep -q "IZRDRALAR_RUNTIME_CAPTURE_PASS" /tmp/izrdralar-capture.log
          test "$(find /tmp/izrdralar-captures -maxdepth 1 -name '*.png' | wc -l)" -eq 6

      - name: Current main runtime startup without timeout-as-pass
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --quit-after 120 2>&1 | tee /tmp/izrdralar-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/izrdralar-runtime.log; then
            exit 1
          fi

      - name: Upload runtime captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izrdralar-m01-m05-runtime-captures
          path: /tmp/izrdralar-captures/*.png
          if-no-files-found: warn

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izrdralar-m01-m05-gate-logs
          path: |
            /tmp/izrdralar-import.log
            /tmp/izrdralar-visual.log
            /tmp/izrdralar-directional.log
            /tmp/izrdralar-xethkioz-direction.log
            /tmp/izrdralar-melee.log
            /tmp/izrdralar-telegraph-timing.log
            /tmp/izrdralar-navigation.log
            /tmp/izrdralar-save.log
            /tmp/izrdralar-authored-runtime.log
            /tmp/izrdralar-ground-texture.log
            /tmp/izrdralar-lake-alignment.log
            /tmp/izrdralar-flow.log
            /tmp/izrdralar-story.log
            /tmp/izrdralar-autosave.log
            /tmp/izrdralar-respawn.log
            /tmp/izrdralar-bootstrap.log
            /tmp/izrdralar-capture.log
            /tmp/izrdralar-runtime.log
          if-no-files-found: warn
