name: Fix Nexus inventory XP reason

on:
  push:
    branches:
      - agent/nexus-pixel-inventory-116

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nexus-pixel-inventory-116
          fetch-depth: 0
      - name: Apply exact XP reason patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/NexusPixelInventoryLayer.tsx')
          text = path.read_text(encoding='utf-8')
          if text.count("'collectible'") != 2:
              raise SystemExit('Expected exactly two collectible XP reasons')
          path.write_text(text.replace("'collectible'", "'mission'"), encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          git diff --check
          test "$(git diff --numstat src/pages/NexusPixelInventoryLayer.tsx | awk '{print $1":"$2}')" = "2:2"
      - name: Remove temporary workflow
        run: rm .github/workflows/nexus-inventory-xp-fix.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/NexusPixelInventoryLayer.tsx .github/workflows/nexus-inventory-xp-fix.yml
          git commit -m "fix(nexus): use supported Wisp XP reason for collectibles"
          git push origin HEAD:agent/nexus-pixel-inventory-116
