name: Apply Fun Nexus fusion

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fun-nexus-fusion-121
    paths:
      - .github/workflows/apply-fun-nexus-fusion.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fun-nexus-fusion-121
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, got {actual}: {old[:80]!r}')
              p.write_text(text.replace(old, new, count))

          replace_exact(
              'src/pages/NexusCity.tsx',
              'export default function NexusCity() {',
              'export default function NexusCity({ embedded = false }: { embedded?: boolean }) {',
          )
          replace_exact(
              'src/pages/NexusCity.tsx',
              '      <SEO title={t.seoTitle} description={t.seoDescription} url="/nexus-city" tags={[\'virtual world\', \'gaming community\', \'avatars\', \'Nexus City\', \'XETHKIOZ\']} />',
              '      {!embedded ? <SEO title={t.seoTitle} description={t.seoDescription} url="/nexus-city" tags={[\'virtual world\', \'gaming community\', \'avatars\', \'Nexus City\', \'XETHKIOZ\']} /> : null}',
          )
          replace_exact(
              'src/pages/NexusCity.tsx',
              '      <main className="xk-city-page">',
              "      <div id={embedded ? 'nexus-city' : undefined} className={`xk-city-page${embedded ? ' xk-city-page-embedded' : ''}`}>",
          )
          replace_exact('src/pages/NexusCity.tsx', '      </main>', '      </div>')

          replace_exact(
              'src/pages/FunPortal.tsx',
              "import FunGameGateway from '../components/fun/FunGameGateway'",
              "import FunGameGateway from '../components/fun/FunGameGateway'\nimport NexusCity from './NexusCity'\nimport './FunNexusFusion.css'",
          )
          replace_exact(
              'src/pages/FunPortal.tsx',
              '          <FunGameGateway lang={lang} />',
              '          <FunGameGateway lang={lang} />\n          <NexusCity embedded />',
          )

          replace_exact(
              'src/App.tsx',
              "const NexusCity = lazy(() => import('./pages/NexusCity'))\n",
              '',
          )
          replace_exact(
              'src/App.tsx',
              '              <Route path="/nexus-city" element={<NexusCity />} />',
              '              <Route path="/nexus-city" element={<Navigate to="/fun#nexus-city" replace />} />',
          )

          for line in [
              "    { to: '/nexus-city', label: 'NEXUS CITY' },\n",
              "    { to: '/nexus-city', label: 'Nexus City', icon: '◎' },\n",
          ]:
              replace_exact('src/components/Header.tsx', line, '', count=2)

          changed = {
              'src/pages/NexusCity.tsx',
              'src/pages/FunPortal.tsx',
              'src/App.tsx',
              'src/components/Header.tsx',
              'src/pages/FunNexusFusion.css',
              '.github/workflows/apply-fun-nexus-fusion.yml',
          }
          import subprocess
          files = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          unexpected = files - changed
          if unexpected:
              raise SystemExit(f'Unexpected files changed: {sorted(unexpected)}')
          PY
      - name: Commit fusion
        run: |
          git config user.name "xethkioz-actions"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/components/Header.tsx src/pages/FunPortal.tsx src/pages/NexusCity.tsx src/pages/FunNexusFusion.css
          git commit -m "feat(fun): fuse Diversion and Nexus City into one portal"
          git rm .github/workflows/apply-fun-nexus-fusion.yml
          git commit -m "chore: remove temporary fusion workflow"
          git push origin HEAD:agent/fun-nexus-fusion-121
