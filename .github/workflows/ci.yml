name: XETHKIOZ CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, rc-live-final-candidate, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xethkioz-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-audit:
    name: Build and Production Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Environment audit
        run: npm run audit:env

      - name: Production readiness audit
        shell: bash
        run: |
          set -o pipefail
          npm run audit:production-ready 2>&1 | tee production-ready-audit.log

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xethkioz-audit-evidence
          path: production-ready-audit.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xethkioz-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Dependency vulnerability audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit.json
          status=$?
          node -e "const fs=require('node:fs');const report=JSON.parse(fs.readFileSync('npm-audit.json','utf8'));console.log('npm audit summary:',report.metadata?.vulnerabilities ?? 'unavailable')"
          exit "$status"

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xethkioz-npm-audit
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload production artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xethkioz-dist
          path: dist
          retention-days: 7
