name: Izrdralar P08 Isabella Runtime Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/npc/isabella_*.gd'
      - 'scenes/characters/P08IsabellaRuntime.tscn'
      - 'tools/isabella_chaos_dummy.gd'
      - 'tools/izrdralar_p08_isabella_runtime_smoke.gd'
      - 'tools/scenes/IzrdralarP08IsabellaRuntimeSmoke.tscn'
      - 'docs/character_core/P08_ISABELLA_RUNTIME_CONTRACT.md'
      - '.github/workflows/izrdralar-p08-isabella-runtime-gate.yml'

concurrency:
  group: izrdralar-p08-isabella-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  p08-isabella:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project and reject parser regressions
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/p08-import.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/p08-import.log; then
            exit 1
          fi

      - name: Validate P08 Isabella controlled-chaos runtime contract
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarP08IsabellaRuntimeSmoke.tscn 2>&1 | tee /tmp/p08-smoke.log
          grep -q "IZRDRALAR_P08_ISABELLA_RUNTIME_PASS" /tmp/p08-smoke.log

      - name: Upload P08 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izrdralar-p08-isabella-runtime-gate-logs
          path: |
            /tmp/p08-import.log
            /tmp/p08-smoke.log
          if-no-files-found: warn
