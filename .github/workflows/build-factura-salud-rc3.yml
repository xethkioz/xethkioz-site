name: Build Factura Salud RC3 Windows

on:
  pull_request:
    paths:
      - ".github/workflows/build-factura-salud-rc3.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruir fuente
        shell: pwsh
        run: |
          $parts = Get-ChildItem "tools/factura-salud-pro/source.parts/part*.txt" | Sort-Object Name
          if ($parts.Count -lt 8) { throw "Faltan partes del archivo fuente" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("FacturaSaludSource.zip", [Convert]::FromBase64String($b64))
          Expand-Archive "FacturaSaludSource.zip" -DestinationPath "FacturaSaludSource" -Force

      - name: Corregir inicio y versión
        shell: pwsh
        working-directory: FacturaSaludSource
        run: |
          $launcher = Get-Content launcher.py -Raw
          $launcher = $launcher.Replace("import multiprocessing", "import logging`nimport multiprocessing")
          $old = '        uvicorn.run(app, host=HOST, port=PORT, log_level="warning", access_log=False)'
          $new = @'
          logging.basicConfig(level=logging.WARNING, format="%(asctime)s %(levelname)s %(name)s: %(message)s")
          uvicorn.run(app, host=HOST, port=PORT, log_level="warning", access_log=False, log_config=None)
          '@.TrimEnd()
          $launcher = $launcher.Replace($old, $new)
          Set-Content launcher.py $launcher -Encoding UTF8

          $spec = Get-Content FacturaSaludLocal.spec -Raw
          $spec = $spec.Replace("hiddenimports = collect_submodules('keyring.backends')", "hiddenimports = collect_submodules('keyring.backends') + collect_submodules('uvicorn')")
          Set-Content FacturaSaludLocal.spec $spec -Encoding UTF8
          Set-Content VERSION "1.0.0-rc3" -Encoding ASCII

          $iss = Get-Content installer/FacturaSaludLocal.iss -Raw
          $iss = $iss.Replace('1.0.0-rc1', '1.0.0-rc3').Replace('1.0.0-rc2', '1.0.0-rc3')
          Set-Content installer/FacturaSaludLocal.iss $iss -Encoding UTF8

          $tests = Get-Content tests/test_app.py -Raw
          $tests = $tests.Replace('1.0.0-rc1', '1.0.0-rc3').Replace('1.0.0-rc2', '1.0.0-rc3')
          Set-Content tests/test_app.py $tests -Encoding UTF8

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        shell: pwsh
        working-directory: FacturaSaludSource
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Ejecutar pruebas
        shell: pwsh
        working-directory: FacturaSaludSource
        run: |
          python -m pytest -q
          python -m compileall -q .

      - name: Compilar ejecutable
        shell: pwsh
        working-directory: FacturaSaludSource
        run: pyinstaller --noconfirm --clean FacturaSaludLocal.spec

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Crear instalador
        shell: pwsh
        working-directory: FacturaSaludSource
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\FacturaSaludLocal.iss"'

      - name: Reunir archivos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item "FacturaSaludSource\dist\FacturaSaludLocal.exe" "release\FacturaSaludLocal.exe"
          $installers = Get-ChildItem "FacturaSaludSource" -Recurse -Filter "*Setup*.exe"
          if (-not $installers) { throw "No se generó el instalador" }
          $installers | Copy-Item -Destination release
          Get-ChildItem release\*.exe | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content release\SHA256SUMS.txt

      - name: Subir ejecutables
        uses: actions/upload-artifact@v4
        with:
          name: FacturaSaludLocal-RC3-Windows
          path: release/*
          retention-days: 30
