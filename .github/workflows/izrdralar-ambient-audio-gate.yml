name: Izrdralar Ambient Audio Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'project.godot'
      - 'src/audio/izrdralar_ambient_audio.gd'
      - 'src/core/accessibility_service.gd'
      - 'src/ui/game_bootstrap_production.gd'
      - 'src/world/izrdralar_m01_m05_runtime_visual_pass10.gd'
      - 'tools/izrdralar_ambient_audio_smoke.gd'
      - 'tools/scenes/IzrdralarAmbientAudioSmoke.tscn'
      - '.github/workflows/izrdralar-ambient-audio-gate.yml'

concurrency:
  group: izrdralar-ambient-audio-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  ambience:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project and reject parser regressions
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/ambient-import.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/ambient-import.log; then
            exit 1
          fi

      - name: M01-M05 procedural ambience smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarAmbientAudioSmoke.tscn 2>&1 | tee /tmp/ambient-smoke.log
          grep -q "IZRDRALAR_AMBIENT_AUDIO_PASS" /tmp/ambient-smoke.log

      - name: Upload ambience logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izrdralar-ambient-audio-gate-logs
          path: |
            /tmp/ambient-import.log
            /tmp/ambient-smoke.log
          if-no-files-found: warn
