name: Patch Nexus pixel gate

on:
  push:
    branches:
      - agent/nexus-pixel-world-112

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nexus-pixel-world-112
      - name: Move the Fun gate to a walkable entrance
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/NexusPixelWorld.tsx')
          text = path.read_text()
          old = "id: 'fun-gate', x: 21, y: 15"
          new = "id: 'fun-gate', x: 21, y: 12"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one coordinate match, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          test "$(git diff --numstat src/pages/NexusPixelWorld.tsx | awk '{print $1":"$2}')" = "1:1"
      - name: Remove temporary workflow
        run: rm .github/workflows/patch-nexus-pixel-gate.yml
      - name: Commit verified patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/NexusPixelWorld.tsx .github/workflows/patch-nexus-pixel-gate.yml
          git commit -m "fix(nexus): place fun gate on walkable tile"
          git push origin HEAD:agent/nexus-pixel-world-112
