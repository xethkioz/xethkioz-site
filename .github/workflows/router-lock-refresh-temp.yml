name: Temporary Router Lock Refresh

on:
  push:
    branches:
      - fix/telemetry-failsafe-20260808

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/telemetry-failsafe-20260808
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lock against npm registry
        run: npm install react-router-dom@7.18.2 --save-exact --package-lock-only --ignore-scripts
      - name: Verify patched versions
        run: |
          node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/react-router']?.version!=='7.18.2'||l.packages['node_modules/react-router-dom']?.version!=='7.18.2') process.exit(1)"
          npm audit --omit=dev --audit-level=high
      - name: Commit generated lock and remove temporary workflow
        run: |
          rm .github/workflows/router-lock-refresh-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/router-lock-refresh-temp.yml
          git commit -m 'security(deps): refresh React Router 7.18.2 lockfile'
          git push origin HEAD:fix/telemetry-failsafe-20260808
