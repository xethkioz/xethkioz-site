name: Build Wildbound Windows

on:
  workflow_dispatch:
  push:
    branches:
      - game/xethkioz-wildbound-prototype

jobs:
  windows-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2 and templates
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Import and validate
        shell: bash
        run: |
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit

      - name: Export Windows x86_64
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p build
          "$GODOT" --headless --path . --export-release "Windows Desktop" build/XETHKIOZ_Wildbound.exe
          cd build
          zip -9 XETHKIOZ_Wildbound_Windows.zip XETHKIOZ_Wildbound.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: XETHKIOZ-Wildbound-Windows
          path: build/XETHKIOZ_Wildbound_Windows.zip
          if-no-files-found: error
