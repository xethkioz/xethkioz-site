name: Build Mundo de Xethkioz Windows

on:
  workflow_dispatch:
  push:
    branches:
      - game/xethkioz-wildbound-prototype
      - game/xethkioz-environment-blocks

jobs:
  windows-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate pixel-art assets
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --quiet pillow
          python tools/generate_v08_assets.py
          python tools/generate_v08_pickups.py
          python tools/generate_v09_demo_assets.py
          test -f assets/v08/generated/izrdalar_bg.png
          test -f assets/v08/generated/menu_bg.png
          test -f assets/v08/generated/creator_bg.png
          test -f assets/v08/generated/traveler.png
          test -f assets/v08/generated/xethkioz.png
          test -f assets/v08/generated/alexis_portrait.png
          test -f assets/v08/generated/ashley_portrait.png
          test -f assets/v08/generated/crystal.png
          test -f assets/v08/generated/food.png
          test -f assets/v08/generated/chest.png
          test -f assets/v08/generated/exit.png
          test -f assets/v08/generated/spike.png
          test -f assets/v09/generated/izrdalar_plains_bg.png
          test -f assets/v09/generated/first_cism_bg.png
          test -f assets/v09/generated/quebracho_prop.png
          test -f assets/v09/generated/ruin_arch_prop.png
          test -f assets/v09/generated/crystal_cluster_prop.png

      - name: Download Godot 4.7.2 and templates
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Import and validate
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit || true

      - name: Layered script diagnostics
        shell: bash
        run: |
          set -uo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          FAILED=0
          for SCRIPT in \
            scripts/save_system.gd \
            scripts/world_data.gd \
            scripts/environment_data.gd \
            scripts/overworld_data.gd \
            scripts/armory_data.gd \
            scripts/overworld_map_view.gd \
            scripts/atmosphere_overlay.gd \
            scripts/enemy.gd \
            scripts/pickup.gd \
            scripts/pet.gd \
            scripts/pet_v6.gd \
            scripts/npc_actor.gd \
            scripts/player.gd \
            scripts/player_v3.gd \
            scripts/player_v4.gd \
            scripts/player_v6.gd \
            scripts/player_v7.gd \
            scripts/player_v8.gd \
            scripts/main.gd \
            scripts/main_v3.gd \
            scripts/main_v4.gd \
            scripts/main_v5.gd \
            scripts/main_v6.gd \
            scripts/main_v7.gd \
            scripts/exploration_node.gd \
            scripts/main_v8.gd \
            scripts/main_v10.gd \
            scripts/main_v11.gd \
            scripts/main_v12.gd \
            scripts/main_v13.gd \
            scripts/main_v14.gd \
            tools/visual_smoke.gd \
            tools/environment_visual_smoke.gd \
            tools/block_progression_test.gd \
            tools/demo_content_test.gd \
            tools/demo_visual_smoke.gd; do
            echo "===== CHECK $SCRIPT ====="
            set +e
            "$GODOT" --headless --path . --check-only --script "res://$SCRIPT" 2>&1 | tee "/tmp/$(basename "$SCRIPT").log"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -ne 0 ] || grep -E "SCRIPT ERROR|ERROR:" "/tmp/$(basename "$SCRIPT").log"; then
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "One or more layered scripts failed diagnostics"
            exit 1
          fi

      - name: Validate 32-map environment matrix
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --script res://scripts/environment_matrix_test.gd 2>&1 | tee /tmp/environment-matrix.log
          grep -q "Environment matrix: 32/32 profiles valid" /tmp/environment-matrix.log

      - name: Validate Steam demo content model
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --script res://tools/demo_content_test.gd 2>&1 | tee /tmp/demo-content.log
          grep -q "Steam demo content model valid" /tmp/demo-content.log

      - name: Validate Izrdalar maps 1-5 progression
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --script res://tools/block_progression_test.gd 2>&1 | tee /tmp/block-progression.log
          grep -q "Izrdalar block progression: 1→2→3→4→5→6 valid" /tmp/block-progression.log

      - name: Runtime startup smoke test
        shell: bash
        run: |
          set -uo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          set +e
          timeout 15s "$GODOT" --headless --path . --quit-after 180 2>&1 | tee /tmp/world-of-xethkioz-runtime.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|ERROR:" /tmp/world-of-xethkioz-runtime.log; then
            echo "Runtime errors detected during startup smoke test"
            exit 1
          fi
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            echo "Godot exited with status $STATUS"
            exit "$STATUS"
          fi

      - name: Install xvfb
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi

      - name: Core visual smoke screenshots
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p build
          xvfb-run -a "$GODOT" --path . --rendering-method gl_compatibility --script res://tools/visual_smoke.gd
          test -f build/v08_menu_preview.png
          test -f build/v08_creator_preview.png
          test -f build/v08_gameplay_preview.png

      - name: Demo overworld and armory screenshots
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          xvfb-run -a "$GODOT" --path . --rendering-method gl_compatibility --script res://tools/demo_visual_smoke.gd
          test -f build/demo_overworld_preview.png
          test -f build/demo_armory_preview.png

      - name: Environment progression screenshots 1-5
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          xvfb-run -a "$GODOT" --path . --rendering-method gl_compatibility --script res://tools/environment_visual_smoke.gd
          for N in 01 02 03 04 05; do test -f "build/env_map_${N}.png"; done

      - name: Upload visual previews
        uses: actions/upload-artifact@v4
        with:
          name: Mundo-de-Xethkioz-v0.9.1-Steam-Demo-Previews
          path: |
            build/v08_menu_preview.png
            build/v08_creator_preview.png
            build/v08_gameplay_preview.png
            build/demo_overworld_preview.png
            build/demo_armory_preview.png
            build/env_map_01.png
            build/env_map_02.png
            build/env_map_03.png
            build/env_map_04.png
            build/env_map_05.png
          if-no-files-found: error

      - name: Export Windows x86_64
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p build
          "$GODOT" --headless --path . --export-release "Windows Desktop" build/Mundo_de_Xethkioz.exe
          cd build
          zip -9 Mundo_de_Xethkioz_Windows.zip Mundo_de_Xethkioz.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Mundo-de-Xethkioz-Windows-v0.9.1-Steam-Demo-Foundation
          path: build/Mundo_de_Xethkioz_Windows.zip
          if-no-files-found: error
