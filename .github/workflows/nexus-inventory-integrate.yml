name: Integrate Nexus pixel inventory

on:
  push:
    branches:
      - agent/nexus-pixel-inventory-116

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nexus-pixel-inventory-116
          fetch-depth: 0
      - name: Apply exact integration patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/NexusPixelWorld.tsx')
          text = path.read_text(encoding='utf-8')
          import_old = "import SEO from '../components/SEO'\n"
          import_new = "import SEO from '../components/SEO'\nimport NexusPixelInventoryLayer from './NexusPixelInventoryLayer'\n"
          tiles_old = "            {tiles.map((tile) => <span key={`${area}-${tile.x}-${tile.y}`} className={`xk-pixel-tile is-${tile.kind}`} style={{ left: tile.x * TILE_SIZE, top: tile.y * TILE_SIZE }} aria-hidden=\"true\" />)}\n"
          tiles_new = tiles_old + "            <NexusPixelInventoryLayer area={area} position={position} lang={lang} questCompleted={quest.completed} onNotice={setNotice} />\n"
          if text.count(import_old) != 1:
              raise SystemExit('Expected exactly one SEO import anchor')
          if text.count(tiles_old) != 1:
              raise SystemExit('Expected exactly one tile render anchor')
          text = text.replace(import_old, import_new, 1).replace(tiles_old, tiles_new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify patch scope
        run: |
          git diff --check
          grep -q "NexusPixelInventoryLayer" src/pages/NexusPixelWorld.tsx
          test "$(git diff --numstat src/pages/NexusPixelWorld.tsx | awk '{print $1":"$2}')" = "2:0"
      - name: Remove temporary workflow
        run: rm .github/workflows/nexus-inventory-integrate.yml
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/NexusPixelWorld.tsx .github/workflows/nexus-inventory-integrate.yml
          git commit -m "feat(nexus): connect collectible inventory to pixel world"
          git push origin HEAD:agent/nexus-pixel-inventory-116
