name: Dependency Lock Refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-lock:
    if: github.head_ref == 'agent/content-refresh-170'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate candidate lockfile
        run: npm install react-router-dom@6.30.4 --save-exact --package-lock-only --ignore-scripts
      - name: Generate dependency audit report
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > generated-npm-audit.json
          exit 0
      - name: Upload generated manifests and audit
        uses: actions/upload-artifact@v4
        with:
          name: safe-react-router-lock
          path: |
            package.json
            package-lock.json
            generated-npm-audit.json
          retention-days: 1
      - name: Enforce clean production dependency audit
        run: node -e "const fs=require('node:fs');const report=JSON.parse(fs.readFileSync('generated-npm-audit.json','utf8'));const total=report.metadata?.vulnerabilities?.total ?? 1;if(total){console.error(report.vulnerabilities);process.exit(1)}"
