name: World of Xethkioz v3.3 CI

on:
  workflow_dispatch:
  push:
    branches:
      - game/xethkioz-v33-vertical-slice

permissions:
  contents: read

jobs:
  godot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/import.log || true
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/import.log; then exit 1; fi
      - name: Check v3.3 scripts
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          for script in $(find src -name '*.gd' | sort); do
            "$GODOT" --headless --path . --check-only --script "res://$script"
          done
      - name: Boot vertical slice
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 8s "$GODOT" --headless --path . || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then exit "${code}"; fi
