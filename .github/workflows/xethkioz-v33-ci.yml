name: World of Xethkioz v3.6 Real Demo CI

on:
  workflow_dispatch:
  push:
    branches:
      - game/xethkioz-v36-real-demo

permissions:
  contents: read

concurrency:
  group: world-of-xethkioz-v36-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Import and compile project
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/import.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/import.log; then
            echo "Godot import/compile validation failed"
            exit 1
          fi

      - name: Boot production flow
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 8s "$GODOT" --headless --path . 2>&1 | tee /tmp/boot.log || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then exit "${code}"; fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|ERROR:" /tmp/boot.log; then exit 1; fi

      - name: Boot Golden Region runtime
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 8s "$GODOT" --headless --path . scenes/v34/GoldenRegion.tscn 2>&1 | tee /tmp/golden.log || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then exit "${code}"; fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|ERROR:" /tmp/golden.log; then
            echo "Golden Region runtime smoke test failed"
            exit 1
          fi

      - name: Boot Refugio de Elida runtime
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 8s "$GODOT" --headless --path . scenes/v34/RefugioInterior.tscn 2>&1 | tee /tmp/refugio.log || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then exit "${code}"; fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|ERROR:" /tmp/refugio.log; then
            echo "Refugio runtime smoke test failed"
            exit 1
          fi

      - name: Validate v3.6 canonical progression and save round-trip
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --script res://tools/v36_progression_smoke.gd 2>&1 | tee /tmp/progression.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|ERROR:" /tmp/progression.log; then
            echo "v3.6 progression/save smoke reported errors"
            exit 1
          fi
          grep -q "V3.6 progression/save smoke PASSED" /tmp/progression.log

      - name: Capture real 640x360 production previews
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p build/previews
          set +e
          timeout 180s xvfb-run -a "$GODOT" --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tools/v34_visual_capture.gd 2>&1 | tee /tmp/visual.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -eq 124 ]; then
            echo "Production visual capture timed out after 180 seconds"
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          for PREVIEW in v34_menu.png v34_creator.png v34_cuenca.png v34_lago.png v34_boss5.png v34_refugio.png; do
            test -s "build/previews/$PREVIEW"
          done
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|ERROR:" /tmp/visual.log; then
            echo "Production visual capture reported runtime errors"
            exit 1
          fi

      - name: Enforce visual regression floor
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --script res://tools/v35_visual_quality_gate.gd 2>&1 | tee /tmp/visual_quality.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|VISUAL QUALITY:|V3.5 visual quality gate FAILED" /tmp/visual_quality.log; then
            echo "Visual regression floor failed"
            exit 1
          fi
          grep -q "V3.5 visual quality gate PASSED" /tmp/visual_quality.log

      - name: Upload real production previews
        uses: actions/upload-artifact@v4
        with:
          name: world-of-xethkioz-v36-previews-${{ github.sha }}
          path: build/previews/*.png
          retention-days: 30
          if-no-files-found: error

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-stable-export-templates

      - name: Install Windows export template
        shell: bash
        run: |
          set -euxo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          if [ ! -f "$TEMPLATE_DIR/windows_release_x86_64.exe" ]; then
            wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/godot-templates.tpz
            rm -rf /tmp/godot-templates
            mkdir -p /tmp/godot-templates
            unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
            WINDOWS_TEMPLATE="$(find /tmp/godot-templates -type f -name windows_release_x86_64.exe -print -quit)"
            test -n "$WINDOWS_TEMPLATE"
            TEMPLATE_SOURCE="$(dirname "$WINDOWS_TEMPLATE")"
            mkdir -p "$TEMPLATE_DIR"
            cp -a "$TEMPLATE_SOURCE"/. "$TEMPLATE_DIR"/
          fi
          test -s "$TEMPLATE_DIR/windows_release_x86_64.exe"

      - name: Export and boot packaged runtime
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p build/package
          "$GODOT" --headless --path . --export-pack "Windows Desktop" build/package/WorldOfXethkiozDemo.pck 2>&1 | tee /tmp/package_export.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|ERROR:" /tmp/package_export.log; then
            echo "Packaged runtime export reported Godot errors"
            exit 1
          fi
          test -s build/package/WorldOfXethkiozDemo.pck
          timeout 10s "$GODOT" --headless --main-pack build/package/WorldOfXethkiozDemo.pck 2>&1 | tee /tmp/package_boot.log || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then exit "${code}"; fi
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|ERROR:|Failed loading resource|Cannot open file" /tmp/package_boot.log; then
            echo "Packaged runtime boot failed"
            exit 1
          fi

      - name: Export Windows internal build
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p build/windows
          "$GODOT" --headless --path . --export-release "Windows Desktop" build/windows/WorldOfXethkiozDemo.exe 2>&1 | tee /tmp/export.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|ERROR:" /tmp/export.log; then
            echo "Windows production export reported Godot errors"
            exit 1
          fi
          test -s build/windows/WorldOfXethkiozDemo.exe
          sha256sum build/windows/WorldOfXethkiozDemo.exe > build/windows/SHA256SUMS.txt

      - name: Upload Windows internal build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: world-of-xethkioz-v36-internal-${{ github.sha }}
          path: build/windows/*
          retention-days: 30
          if-no-files-found: error

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xethkioz-v36-ci-diagnostics-${{ github.sha }}
          path: |
            /tmp/import.log
            /tmp/boot.log
            /tmp/golden.log
            /tmp/refugio.log
            /tmp/progression.log
            /tmp/visual.log
            /tmp/visual_quality.log
            /tmp/package_export.log
            /tmp/package_boot.log
            /tmp/export.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Build source snapshot
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          SHORT_SHA="${GITHUB_SHA::8}"
          mkdir -p /tmp/xethkioz-snapshot
          tar -czf "/tmp/xethkioz-snapshot/world-of-xethkioz-v36-${SHORT_SHA}.tar.gz" \
            project.godot export_presets.cfg src scenes data assets tools docs/v33 docs/v34 docs/v35 docs/v36

      - name: Upload source snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: world-of-xethkioz-v36-source-${{ github.sha }}
          path: /tmp/xethkioz-snapshot/*.tar.gz
          retention-days: 30
          if-no-files-found: error
