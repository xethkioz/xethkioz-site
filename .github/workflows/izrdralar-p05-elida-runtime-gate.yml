name: Izrdralar P05 Elida Runtime Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/npc/elida_*.gd'
      - 'scenes/characters/P05ElidaRuntime.tscn'
      - 'tools/elida_support_dummy.gd'
      - 'tools/izrdralar_p05_elida_runtime_smoke.gd'
      - 'tools/scenes/IzrdralarP05ElidaRuntimeSmoke.tscn'
      - 'docs/character_core/P05_ELIDA_RUNTIME_CONTRACT.md'
      - '.github/workflows/izrdralar-p05-elida-runtime-gate.yml'

concurrency:
  group: izrdralar-p05-elida-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  p05-elida:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project and reject parser regressions
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/p05-import.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/p05-import.log; then
            exit 1
          fi

      - name: Validate P05 Elida support runtime contract
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarP05ElidaRuntimeSmoke.tscn 2>&1 | tee /tmp/p05-smoke.log
          grep -q "IZRDRALAR_P05_ELIDA_RUNTIME_PASS" /tmp/p05-smoke.log

      - name: Upload P05 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izrdralar-p05-elida-runtime-gate-logs
          path: |
            /tmp/p05-import.log
            /tmp/p05-smoke.log
          if-no-files-found: warn
