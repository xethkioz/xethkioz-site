name: Izrdralar P03 Alexis Runtime Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/production/characters/p03_approved/**'
      - 'src/npc/alexis_approved_visual.gd'
      - 'src/npc/alexis_guide_runtime.gd'
      - 'src/world/izrdralar_m01_m05_runtime_visual_pass12.gd'
      - 'scenes/izrdralar/IzrdralarM01M05Runtime.tscn'
      - 'tools/izrdralar_p03_alexis_runtime_smoke.gd'
      - 'tools/scenes/IzrdralarP03AlexisRuntimeSmoke.tscn'
      - '.github/workflows/izrdralar-p03-alexis-runtime-gate.yml'

concurrency:
  group: izrdralar-p03-alexis-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  p03-alexis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project and reject parser regressions
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/p03-import.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/p03-import.log; then
            exit 1
          fi

      - name: Validate P03 Alexis canon and runtime contract
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarP03AlexisRuntimeSmoke.tscn 2>&1 | tee /tmp/p03-smoke.log
          grep -q "IZRDRALAR_P03_ALEXIS_RUNTIME_PASS" /tmp/p03-smoke.log

      - name: Upload P03 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izrdralar-p03-alexis-runtime-gate-logs
          path: |
            /tmp/p03-import.log
            /tmp/p03-smoke.log
          if-no-files-found: warn
