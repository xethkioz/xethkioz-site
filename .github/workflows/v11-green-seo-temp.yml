name: XETHKIOZ v11 Green Node SEO Split

on:
  push:
    branches:
      - v11-foundation-20260813

permissions:
  contents: write

jobs:
  split-green-seo:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-foundation-20260813
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Make Green Node public and keep Vault private
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {text.count(old)}')
              return text.replace(old, new, 1)

          # robots.txt: public hub, private Vault.
          p='public/robots.txt'; s=read(p)
          s=s.replace('Disallow: /green-node\n','')
          if 'Disallow: /green-node/vault\n' not in s:
              s=s.replace('Disallow: /register\n','Disallow: /register\nDisallow: /green-node/vault\n')
          write(p,s)

          # Sitemap: public Green Node is a first-class utility route.
          p='api/sitemap.ts'; s=read(p)
          marker="  { path: '/news', changefreq: 'daily', priority: '0.9' },\n"
          addition=marker+"  { path: '/green-node', changefreq: 'daily', priority: '0.8' },\n"
          if "path: '/green-node'" not in s:
              s=once(s,marker,addition,'sitemap Green Node')
          write(p,s)

          # SEO shell generator: public Green Node Protect shell.
          p='scripts/generate-seo-shells.mjs'; s=read(p)
          if "file: 'green-node.html'" not in s:
              marker="  {\n    file: 'news.html',"
              shell=(
                  "  {\n"
                  "    file: 'green-node.html',\n"
                  "    path: '/green-node',\n"
                  "    title: 'Green Node Protect | Seguridad, privacidad e Internet SOS | XETHKIOZ',\n"
                  "    description: 'Herramientas locales, guías de seguridad digital, privacidad, Linux y alertas verificadas. Green Node Protect ayuda a entender riesgos y actuar sin alarmismo.',\n"
                  "    keywords: 'seguridad digital, privacidad, phishing, Linux, Internet SOS, SHA-256, passkeys, Green Node, XETHKIOZ',\n"
                  "    image: '/assets/identity/green-node-occult-malware-v1.webp',\n"
                  "    imageAlt: 'Green Node Protect de XETHKIOZ',\n"
                  "    localized: false,\n"
                  "  },\n"
              )
              s=once(s,marker,shell+marker,'Green Node SEO shell')
          write(p,s)

          # Vercel: public shell for hub; Vault remains SPA + noindex.
          p='vercel.json'; cfg=json.loads(read(p))
          rewrites=cfg.get('rewrites',[])
          found=False
          for item in rewrites:
              if item.get('source')=='/green-node':
                  item['destination']='/seo-shells/green-node.html'; found=True
          if not found:
              raise SystemExit('Green Node rewrite not found')
          if not any(item.get('source')=='/green-node/vault' for item in rewrites):
              idx=next((i for i,item in enumerate(rewrites) if item.get('source')=='/nexus-city'),len(rewrites))
              rewrites.insert(idx,{'source':'/green-node/vault','destination':'/index.html'})
          cfg['rewrites']=rewrites
          headers=[item for item in cfg.get('headers',[]) if item.get('source')!='/green-node']
          noindex={'headers':[{'key':'X-Robots-Tag','value':'noindex, nofollow, noarchive'}]}
          if not any(item.get('source')=='/green-node/vault' for item in headers):
              headers.append({'source':'/green-node/vault',**noindex})
          if not any(item.get('source')=='/green-node/vault/(.*)' for item in headers):
              headers.append({'source':'/green-node/vault/(.*)',**noindex})
          cfg['headers']=headers
          write(p,json.dumps(cfg,ensure_ascii=False,indent=2)+'\n')

          # Runtime SEO contract protects the split.
          p='scripts/runtime-seo-contract-check.mjs'; s=read(p)
          old="assert(rewriteMap.get('/green-node') === '/index.html', 'Green Node deep links must remain valid without exposing it in navigation.')"
          new=("assert(rewriteMap.get('/green-node') === '/seo-shells/green-node.html', 'Public Green Node Protect must use its own indexable SEO shell.')\n"
               "assert(rewriteMap.get('/green-node/vault') === '/index.html', 'Vault 13 deep links must remain available through the SPA gate.')\n"
               "assert(sitemap.includes(\"path: '/green-node'\"), 'Public Green Node Protect must be present in the sitemap.')\n"
               "assert(seoShells.includes(\"path: '/green-node'\"), 'Public Green Node Protect must generate a standalone SEO shell.')")
          s=once(s,old,new,'runtime Green Node rewrite contract')
          marker="const passportHeaders = headerMap.get('/nexus-city/u/(.*)') ?? []\n"
          if "const greenVaultHeaders" not in s:
              s=once(s,marker,marker+"const greenHubHeaders = headerMap.get('/green-node') ?? []\nconst greenVaultHeaders = headerMap.get('/green-node/vault') ?? []\n",'Green header contract vars')
          marker="assert(passportHeaders.some((item) => item.key === 'X-Robots-Tag' && item.value.includes('noindex') && item.value.includes('noimageindex')), 'Nexus passports must remain server-side noindex until dynamic per-profile SEO exists.')\n"
          addition=(marker+"assert(!greenHubHeaders.some((item) => item.key === 'X-Robots-Tag' && item.value.includes('noindex')), 'Public Green Node Protect must not carry a server-side noindex header.')\n"
                    "assert(greenVaultHeaders.some((item) => item.key === 'X-Robots-Tag' && item.value.includes('noindex')), 'Vault 13 must remain server-side noindex.')\n")
          if 'Public Green Node Protect must not carry' not in s:
              s=once(s,marker,addition,'Green header assertions')
          write(p,s)

          # Initial bundle audit includes public Green Node SEO shell.
          p='scripts/initial-bundle-contract-check.mjs'; s=read(p)
          marker="  'seo-shells/nexus-city.html',\n"
          if "'seo-shells/green-node.html'" not in s:
              s=once(s,marker,marker+"  'seo-shells/green-node.html',\n",'initial bundle Green shell')
          write(p,s)
          PY

      - name: Install and validate
        run: |
          npm ci
          npm run build

      - name: Commit verified SEO split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/robots.txt api/sitemap.ts scripts/generate-seo-shells.mjs vercel.json scripts/runtime-seo-contract-check.mjs scripts/initial-bundle-contract-check.mjs
          git commit -m "feat(v11): publish Green Node Protect while keeping Vault 13 private"
          git push origin HEAD:v11-foundation-20260813
