name: One-time verified Pass 21 source import
on:
  push:
    branches: [perf/premium-mobile-pass21]
    paths: [.github/pass21-import/ready]
permissions:
  contents: write
jobs:
  import-source:
    if: github.ref == 'refs/heads/perf/premium-mobile-pass21'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply tested public source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4162057e304861338aeb2abc912318a927096c5c HEAD
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          changes = subprocess.check_output(['git','diff','--name-only','4162057e304861338aeb2abc912318a927096c5c','HEAD']).decode().splitlines()
          assert all(p.startswith('.github/pass21-import') or p == '.github/workflows/pass21-import.yml' for p in changes)
          encoded = ''.join(pathlib.Path(f'.github/pass21-import/part-{i:02d}').read_text().strip() for i in range(5))
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == '56ebdda767558033c50088e380866f1712de8d3ea66f132a50ef6c202c29f730'
          pathlib.Path('/tmp/pass21.patch').write_bytes(data)
          PY
          git apply --index --check /tmp/pass21.patch
          git apply --index /tmp/pass21.patch
          git rm -r .github/workflows/pass21-import.yml .github/pass21-import.b64 .github/pass21-import
          test "$(git write-tree)" = '39e3e07f2cf2b2adee8571bb5ef21ba6a3b56b2b'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(web): integrate verified Premium Fantasy Pass 21 source'
          git push origin HEAD:refs/heads/perf/premium-mobile-pass21
