name: Patch Nexus RPG safety

on:
  push:
    branches:
      - agent/nexus-pixel-rpg-113

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nexus-pixel-rpg-113
      - name: Harden persistence and area XP
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/NexusPixelWorld.tsx')
          text = path.read_text()
          old_storage = """  useEffect(() => {\n    window.localStorage.setItem(QUEST_STORAGE_KEY, JSON.stringify(quest))\n  }, [quest])"""
          new_storage = """  useEffect(() => {\n    try {\n      window.localStorage.setItem(QUEST_STORAGE_KEY, JSON.stringify(quest))\n    } catch {\n      // Quest progress remains active in memory when browser storage is unavailable.\n    }\n  }, [quest])"""
          old_area = """    setNotice(`${destination.label[lang]} · ${destination.subtitle[lang]}`)\n    addWispXp(2, 'visit', `/nexus-city/room/xethkioz#${nextArea}`)"""
          new_area = """    setNotice(`${destination.label[lang]} · ${destination.subtitle[lang]}`)\n    try {\n      const visitKey = `xethkioz.nexus-pixel.area.${nextArea}`\n      if (!window.sessionStorage.getItem(visitKey)) {\n        window.sessionStorage.setItem(visitKey, '1')\n        addWispXp(2, 'visit', `/nexus-city/room/xethkioz#${nextArea}`)\n      }\n    } catch {\n      // Area transitions remain functional without optional session progression.\n    }"""
          if text.count(old_storage) != 1:
              raise SystemExit(f'Expected one storage block, found {text.count(old_storage)}')
          if text.count(old_area) != 1:
              raise SystemExit(f'Expected one area XP block, found {text.count(old_area)}')
          path.write_text(text.replace(old_storage, new_storage).replace(old_area, new_area))
          PY
          git diff --check
      - name: Remove temporary workflow
        run: rm .github/workflows/patch-nexus-rpg-safety.yml
      - name: Commit verified patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/NexusPixelWorld.tsx .github/workflows/patch-nexus-rpg-safety.yml
          git commit -m "fix(nexus): harden quest persistence and area rewards"
          git push origin HEAD:agent/nexus-pixel-rpg-113
