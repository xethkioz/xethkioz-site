name: Izrdralar Accessibility Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'project.godot'
      - 'src/core/accessibility_service.gd'
      - 'src/player/player_controller_production_pass02.gd'
      - 'src/ui/game_bootstrap_production.gd'
      - 'tools/izrdralar_accessibility_smoke.gd'
      - 'tools/scenes/IzrdralarAccessibilitySmoke.tscn'
      - '.github/workflows/izrdralar-accessibility-gate.yml'

concurrency:
  group: izrdralar-accessibility-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  accessibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project and reject parser regressions
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/accessibility-import.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/accessibility-import.log; then
            exit 1
          fi

      - name: Accessibility persistence and reduced-motion smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarAccessibilitySmoke.tscn 2>&1 | tee /tmp/accessibility-smoke.log
          grep -q "IZRDRALAR_ACCESSIBILITY_PASS" /tmp/accessibility-smoke.log

      - name: Upload accessibility logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izrdralar-accessibility-gate-logs
          path: |
            /tmp/accessibility-import.log
            /tmp/accessibility-smoke.log
          if-no-files-found: warn
