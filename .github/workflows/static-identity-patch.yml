name: Audited static identity patch

on:
  push:
    branches:
      - agent/public-metadata-nexus-103
    paths:
      - .github/workflows/static-identity-patch.yml

permissions:
  contents: write

jobs:
  patch-static-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/public-metadata-nexus-103
          fetch-depth: 0

      - name: Replace exactly two residual identity strings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('public/opensearch.xml'): (
                  'Buscar noticias, guías y señales dentro del universo XETHKIOZ.',
                  'Buscar noticias, guías y señales dentro de la Red de Portales XETHKIOZ.',
              ),
              Path('creacion-web.html'): (
                  'Una idea puede convertirse en su propio universo con XETHKIOZ.',
                  'Una idea puede convertirse en una experiencia digital propia con XETHKIOZ.',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence in {path}, found {count}: {old}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify exact patch and remove workflow
        shell: bash
        run: |
          test "$(git diff --name-only | sort)" = $'creacion-web.html\npublic/opensearch.xml'
          test "$(git diff --numstat -- creacion-web.html)" = $'1\t1\tcreacion-web.html'
          test "$(git diff --numstat -- public/opensearch.xml)" = $'1\t1\tpublic/opensearch.xml'
          rm .github/workflows/static-identity-patch.yml
          git config user.name "xethkioz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(metadata): remove residual universe branding"
          git push origin HEAD:agent/public-metadata-nexus-103
