name: Izrdralar Combat Visual Capture

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scenes/izrdralar/**'
      - 'src/fx/**'
      - 'src/player/**'
      - 'src/npc/**'
      - 'src/world/izrdralar_*'
      - 'tools/izrdralar_combat_visual_capture.gd'
      - 'tools/scenes/IzrdralarCombatVisualCapture.tscn'
      - '.github/workflows/izrdralar-combat-visual-capture.yml'

concurrency:
  group: izrdralar-combat-visual-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project and reject parse errors
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/izrdralar-combat-import.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/izrdralar-combat-import.log; then
            exit 1
          fi

      - name: Capture combat feedback at 640x360
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          rm -rf /tmp/izrdralar-combat-captures
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi
          timeout 60s xvfb-run -a "$GODOT" --path . --rendering-method gl_compatibility res://tools/scenes/IzrdralarCombatVisualCapture.tscn 2>&1 | tee /tmp/izrdralar-combat-capture.log
          grep -q "IZRDRALAR_COMBAT_VISUAL_CAPTURE_PASS" /tmp/izrdralar-combat-capture.log
          test "$(find /tmp/izrdralar-combat-captures -maxdepth 1 -name '*.png' | wc -l)" -eq 3

      - name: Upload combat captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izrdralar-combat-visual-captures
          path: /tmp/izrdralar-combat-captures/*.png
          if-no-files-found: warn

      - name: Upload combat capture log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izrdralar-combat-visual-log
          path: |
            /tmp/izrdralar-combat-import.log
            /tmp/izrdralar-combat-capture.log
          if-no-files-found: warn
