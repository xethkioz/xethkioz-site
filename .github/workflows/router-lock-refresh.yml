name: React Router Lock Refresh

on:
  push:
    branches: [agent/redeploy-clean-main-150]

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/redeploy-clean-main-150

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate lockfile with patched router
        run: npm install react-router-dom@7.18.1 --save-exact --package-lock-only --ignore-scripts

      - name: Install generated dependency graph
        run: npm ci

      - name: Verify dependency security
        run: npm audit --omit=dev

      - name: Verify application
        run: npm run build

      - name: Commit verified manifests to branch
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Router manifests already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security(deps): upgrade React Router to 7.18.1"
          git push origin HEAD:agent/redeploy-clean-main-150

      - name: Upload refreshed manifests
        uses: actions/upload-artifact@v4
        with:
          name: react-router-7-lockfiles
          path: |
            package.json
            package-lock.json
          retention-days: 1
