name: Prepare reviewed Premium Fantasy branch
on:
  push:
    branches: [design/premium-fantasy-pass20]
    paths: [scripts/premium-pass20-prepare.mjs]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/design/premium-fantasy-pass20'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed presentation contracts
        run: |
          test "${GITHUB_REF}" = "refs/heads/design/premium-fantasy-pass20"
          test "$(git hash-object scripts/premium-pass20-prepare.mjs)" = "50211a4e757b64568eadc26d417b9e6de795ba13"
          node scripts/premium-pass20-prepare.mjs
          git add src/App.tsx src/components/Header.tsx scripts/content-design-check.mjs scripts/production-ready-check.mjs scripts/web-services-check.mjs scripts/generate-seo-shells.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(fantasy): align public shell and validation contracts'
          git push origin HEAD:refs/heads/design/premium-fantasy-pass20
