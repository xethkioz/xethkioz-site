name: Izrdralar Mentor FX Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/audio/**'
      - 'src/fx/**'
      - 'src/player/player_controller_production.gd'
      - 'tools/izrdralar_mentor_fx_smoke.gd'
      - 'tools/scenes/IzrdralarMentorFxSmoke.tscn'
      - '.github/workflows/izrdralar-mentor-fx-gate.yml'

concurrency:
  group: izrdralar-mentor-fx-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  mentor-fx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project and reject parser regressions
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/mentor-fx-import.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/mentor-fx-import.log; then
            exit 1
          fi

      - name: Mentor VFX and procedural SFX smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarMentorFxSmoke.tscn 2>&1 | tee /tmp/mentor-fx-smoke.log
          grep -q "IZRDRALAR_MENTOR_FX_PASS" /tmp/mentor-fx-smoke.log

      - name: Upload mentor FX logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izrdralar-mentor-fx-gate-logs
          path: |
            /tmp/mentor-fx-import.log
            /tmp/mentor-fx-smoke.log
          if-no-files-found: warn
