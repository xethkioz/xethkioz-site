name: Izrdralar P09 Gael Runtime Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/npc/gael_*.gd'
      - 'scenes/characters/P09GaelRuntime.tscn'
      - 'tools/gael_stealth_dummy.gd'
      - 'tools/izrdralar_p09_gael_runtime_smoke.gd'
      - 'tools/scenes/IzrdralarP09GaelRuntimeSmoke.tscn'
      - 'docs/character_core/P09_GAEL_RUNTIME_CONTRACT.md'
      - '.github/workflows/izrdralar-p09-gael-runtime-gate.yml'

concurrency:
  group: izrdralar-p09-gael-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  p09-gael:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project and reject parser regressions
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/p09-import.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/p09-import.log; then
            exit 1
          fi

      - name: Validate P09 Gael stealth and precision runtime contract
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarP09GaelRuntimeSmoke.tscn 2>&1 | tee /tmp/p09-smoke.log
          grep -q "IZRDRALAR_P09_GAEL_RUNTIME_PASS" /tmp/p09-smoke.log

      - name: Upload P09 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izrdralar-p09-gael-runtime-gate-logs
          path: |
            /tmp/p09-import.log
            /tmp/p09-smoke.log
          if-no-files-found: warn
