name: Patch Fun Game Gateway

on:
  push:
    branches:
      - agent/fun-game-gateway-118
    paths:
      - .github/workflows/patch-fun-game-gateway.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fun-game-gateway-118
          fetch-depth: 0

      - name: Apply exact replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/pages/FunPortal.tsx'): [
                  (
                      "import PublicAdSlot from '../components/ads/PublicAdSlot'\n",
                      "import PublicAdSlot from '../components/ads/PublicAdSlot'\nimport FunGameGateway from '../components/fun/FunGameGateway'\n",
                  ),
                  (
                      "    title: 'Memes',\n    description: 'El lado más caótico de internet: memes, clips y rarezas servidos como un episodio anime fuera de control.',",
                      "    title: 'Diversión y juego',\n    description: 'Entrá a Plaza Nexus y seguí bajando para encontrar memes, chistes, clips y rarezas servidos con energía de caos.',",
                  ),
                  (
                      "    title: 'Memes',\n    description: 'The most chaotic side of the internet: memes, clips and oddities served like an out-of-control anime episode.',",
                      "    title: 'Fun & Play',\n    description: 'Enter Nexus Plaza, then keep scrolling for memes, jokes, clips and oddities powered by pure chaos.',",
                  ),
                  (
                      "          <section className=\"xk-anime-hero xk-meme-hero\" aria-labelledby=\"fun-title\">",
                      "          <FunGameGateway lang={lang} />\n\n          <section id=\"humor\" className=\"xk-anime-hero xk-meme-hero scroll-mt-24\" aria-labelledby=\"fun-title\">",
                  ),
              ],
              Path('src/pages/Home.tsx'): [
                  (
                      "        subtitle: 'Memes · Arte · Videos · Caos',",
                      "        subtitle: 'Juego · Memes · Clips · Caos',",
                  ),
                  (
                      "        action: 'ATRAVESAR PORTAL',\n        route: '/fun',",
                      "        action: 'JUGAR AHORA',\n        route: '/fun',",
                  ),
                  (
                      "        subtitle: 'Memes · Art · Videos · Chaos',",
                      "        subtitle: 'Game · Memes · Clips · Chaos',",
                  ),
                  (
                      "        action: 'CROSS PORTAL',\n        route: '/fun',",
                      "        action: 'PLAY NOW',\n        route: '/fun',",
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one match, found {count}: {old[:70]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify focused diff
        run: |
          git diff --check
          git diff -- src/pages/FunPortal.tsx src/pages/Home.tsx

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/patch-fun-game-gateway.yml
          git config user.name "xethkioz-actions"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/FunPortal.tsx src/pages/Home.tsx .github/workflows/patch-fun-game-gateway.yml
          git commit -m "feat(fun): promote Plaza Nexus as main fun experience"
          git push origin HEAD:agent/fun-game-gateway-118
