name: Validate World of Xethkioz Demo 1-15

on:
  workflow_dispatch:
  push:
    branches:
      - game/xethkioz-environment-blocks
      - game/xethkioz-golden-slice-production

jobs:
  demo-15-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate assets
        run: |
          python -m pip install --quiet pillow
          python tools/generate_v08_assets.py
          python tools/generate_v08_pickups.py
          python tools/generate_v09_demo_assets.py
          python tools/generate_v09_boss_assets.py
          python tools/generate_v095_golden_assets.py
      - name: Download Godot
        run: |
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import project
        run: |
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit || true
      - name: Validate 15 playable maps
        run: |
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --script res://tools/demo_15_level_smoke.gd 2>&1 | tee /tmp/demo15.log
          grep -q "Steam demo level smoke: 15/15 maps loaded; bosses 5/10/15 present" /tmp/demo15.log
      - name: Validate Golden Slice 1-5 functionality
        run: |
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --script res://tools/golden_slice_functional_smoke.gd 2>&1 | tee /tmp/golden-functional.log
          grep -q "Golden Slice functional smoke: map1 NPCs/background/skills valid; map5 boss valid" /tmp/golden-functional.log
