name: XETHKIOZ v11 Deep Audit (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare audit directory
        run: mkdir -p audit-v11

      - name: Repository inventory
        run: npm run audit:inventory > audit-v11/project-inventory.txt 2>&1

      - name: Architecture audit
        run: npm run audit:architecture > audit-v11/architecture-audit.txt 2>&1

      - name: Code structure review
        run: npm run audit:code > audit-v11/code-structure.txt 2>&1

      - name: Media assets review
        run: npm run audit:media > audit-v11/media-assets.txt 2>&1

      - name: Route integrity
        run: npm run audit:routes > audit-v11/routes.txt 2>&1

      - name: Portal registry
        run: npm run audit:portal > audit-v11/portals.txt 2>&1

      - name: Security hardening audit
        run: npm run audit:security-hardening > audit-v11/security-hardening.txt 2>&1

      - name: Privacy audit
        run: npm run audit:privacy-consent > audit-v11/privacy-consent.txt 2>&1

      - name: Auth session audit
        run: npm run audit:auth-session-security > audit-v11/auth-session.txt 2>&1

      - name: Editorial integrity
        run: npm run audit:editorial-integrity > audit-v11/editorial-integrity.txt 2>&1

      - name: CSS inventory
        run: npm run audit:css-source > audit-v11/css-source.txt 2>&1

      - name: Dependency audit
        run: npm run audit:dependencies > audit-v11/dependencies.txt 2>&1

      - name: Public asset size and duplicate inventory
        shell: bash
        run: |
          echo "TOTAL PUBLIC SIZE" > audit-v11/public-assets.txt
          du -sh public >> audit-v11/public-assets.txt
          echo >> audit-v11/public-assets.txt
          echo "TOP 100 FILES BY SIZE" >> audit-v11/public-assets.txt
          find public -type f -printf '%s\t%p\n' | sort -nr | head -100 >> audit-v11/public-assets.txt
          echo >> audit-v11/public-assets.txt
          echo "DUPLICATE SHA256 GROUPS" >> audit-v11/public-assets.txt
          find public -type f -print0 | xargs -0 sha256sum | sort | awk 'BEGIN{prev=""; group=""; count=0} {hash=$1; $1=""; sub(/^  /,""); file=$0; if(hash==prev){if(count==1) print prevFile; print file; count++} else {if(count>1) print ""; prev=hash; prevFile=file; count=1}} END{if(count>1) print ""}' >> audit-v11/public-assets.txt

      - name: Build production bundle
        run: npm run build > audit-v11/build.txt 2>&1

      - name: Initial bundle contract
        run: npm run audit:initial-bundle > audit-v11/initial-bundle.txt 2>&1

      - name: Upload deep audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xethkioz-v11-deep-audit
          path: |
            audit-v11
            npm-audit.json
          retention-days: 30
