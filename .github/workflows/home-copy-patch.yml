name: Audited Home copy patch

on:
  push:
    branches:
      - agent/home-identity-102
    paths:
      - .github/workflows/home-copy-patch.yml

permissions:
  contents: write

jobs:
  patch-home-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-identity-102
          fetch-depth: 0

      - name: Replace exactly four identity strings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/Home.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'Entrada inmersiva al universo XETHKIOZ: gaming, ciencia, diversión, Nexus City, Green Node y creación web.',
                  'Entrada inmersiva a la Red de Portales XETHKIOZ: gaming, ciencia, diversión, Nexus City, Green Node y creación web.',
              ),
              (
                  'El universo continúa después del portal.',
                  'La Red de Portales continúa más allá de la escena principal.',
              ),
              (
                  'An immersive entrance to the XETHKIOZ universe: gaming, science, fun, Nexus City, Green Node and web creation.',
                  'An immersive entrance to the XETHKIOZ Portal Network: gaming, science, fun, Nexus City, Green Node and web creation.',
              ),
              (
                  'The universe continues beyond the portal.',
                  'The Portal Network continues beyond the main gates.',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify exact diff and remove workflow
        shell: bash
        run: |
          test "$(git diff --name-only -- src/pages/Home.tsx)" = "src/pages/Home.tsx"
          test "$(git diff --numstat -- src/pages/Home.tsx)" = $'4\t4\tsrc/pages/Home.tsx'
          rm .github/workflows/home-copy-patch.yml
          git config user.name "xethkioz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(home): align copy with portal network"
          git push origin HEAD:agent/home-identity-102
