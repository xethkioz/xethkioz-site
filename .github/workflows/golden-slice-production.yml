name: Golden Slice Production Windows

on:
  workflow_dispatch:
  push:
    branches:
      - game/xethkioz-golden-slice-production

jobs:
  golden-slice-production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate current game assets
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --quiet pillow
          python tools/generate_v08_assets.py
          python tools/generate_v08_pickups.py
          python tools/generate_v09_demo_assets.py
          python tools/generate_v09_boss_assets.py
          python tools/generate_v095_golden_assets.py
          python tools/generate_elida_production.py
          test -f assets/production/generated/elida_apothecary.png
          test -f assets/production/generated/elida_apothecary_portrait.png

      - name: Install Godot 4.7.2 and Windows templates
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Import project
        shell: bash
        run: |
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/import.log || true
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/import.log; then exit 1; fi

      - name: Validate production scripts
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --check-only --script res://scripts/save_system.gd
          "$GODOT" --headless --path . --check-only --script res://scripts/player_v10.gd
          "$GODOT" --headless --path . --check-only --script res://scripts/main_v20.gd
          "$GODOT" --headless --path . --check-only --script res://scripts/main_v21.gd
          "$GODOT" --headless --path . --check-only --script res://tools/golden_slice_production_smoke.gd

      - name: Golden Slice functional smoke
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --script res://tools/golden_slice_functional_smoke.gd 2>&1 | tee /tmp/golden.log
          grep -q "Golden Slice functional smoke: map1 NPCs/background/skills valid; map5 boss valid" /tmp/golden.log

      - name: Validate creator intro mentor refuge and traversal unlock
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --script res://tools/golden_slice_production_smoke.gd 2>&1 | tee /tmp/production-flow.log
          grep -q "Golden Slice production smoke: creator->intro->node1 and mentor->refuge->double-jump->node6 valid" /tmp/production-flow.log

      - name: Regression smoke 1-15
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --script res://tools/demo_15_level_smoke.gd 2>&1 | tee /tmp/demo15.log
          grep -q "Steam demo level smoke: 15/15 maps loaded; bosses 5/10/15 present" /tmp/demo15.log

      - name: Runtime startup
        shell: bash
        run: |
          set -uo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          set +e
          timeout 15s "$GODOT" --headless --path . --quit-after 180 2>&1 | tee /tmp/runtime.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" /tmp/runtime.log; then exit 1; fi
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then exit "$STATUS"; fi

      - name: Capture real Golden Slice screens
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p build
          xvfb-run -a "$GODOT" --path . --rendering-method gl_compatibility --script res://tools/golden_slice_visual_smoke.gd
          for F in build/golden_menu.png build/golden_creator.png build/golden_dialogue.png build/golden_transition.png build/golden_refuge.png; do
            test -f "$F"
          done

      - name: Upload real Golden Slice previews
        uses: actions/upload-artifact@v4
        with:
          name: World-of-Xethkioz-Golden-Slice-v0.10.1-Real-Previews
          path: |
            build/golden_menu.png
            build/golden_creator.png
            build/golden_dialogue.png
            build/golden_transition.png
            build/golden_refuge.png
          if-no-files-found: error

      - name: Export Windows x86_64
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p build
          "$GODOT" --headless --path . --export-release "Windows Desktop" build/Mundo_de_Xethkioz.exe
          cd build
          zip -9 World_of_Xethkioz_Golden_Slice_v0.10.1_Windows.zip Mundo_de_Xethkioz.exe

      - name: Upload Windows production test
        uses: actions/upload-artifact@v4
        with:
          name: World-of-Xethkioz-Golden-Slice-v0.10.1-Windows
          path: build/World_of_Xethkioz_Golden_Slice_v0.10.1_Windows.zip
          if-no-files-found: error
