name: Izrdralar Integration Scaffold 01-32

on:
  workflow_dispatch:
  push:
    branches:
      - game/izrdralar-production-integration-20260910

jobs:
  izrdralar-integration-scaffold:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Validate production base and manifest
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq 'run/main_scene="res://scenes/v34/GameBootstrap.tscn"' project.godot
          test -f src/player/player_controller_production.gd
          test -f src/world/production_chunk.gd
          test -f src/world/izrdralar_map_chain_test.gd
          test -f src/world/izrdralar_generic_chunk.gd
          test -f scenes/test/IzrdralarMapChainTest.tscn
          test -f docs/CURRENT_STATE_WORLD_OF_XETHKIOZ.md
          python3 - <<'PY'
          import json
          p='data/regions/izrdralar_map_chain_01_32.json'
          d=json.load(open(p,encoding='utf-8'))
          maps=d['maps']
          assert len(maps)==32
          assert [m['id'] for m in maps]==list(range(1,33))
          assert [m['id'] for m in maps if m['t']=='boss']==[5,10,15,20,25,30]
          assert maps[31]['t']=='legendary'
          print('IZRDRALAR MANIFEST 01-32: PASS')
          PY

      - name: Import full production project
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/import.log; then
            exit 1
          fi

      - name: Smoke production bootstrap
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          set +e
          timeout 20s "$GODOT" --headless --path . --quit-after 8 2>&1 | tee /tmp/bootstrap.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:' /tmp/bootstrap.log; then
            exit 1
          fi
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            exit "$STATUS"
          fi

      - name: Runtime all 32 scaffold maps without replacing production main scene
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          for ID in $(seq 1 32); do
            echo "=== IZR-M$(printf '%02d' "$ID") ==="
            set +e
            XETHKIOZ_MAP_ID="$ID" timeout 15s "$GODOT" --headless --path . --quit-after 5 res://scenes/test/IzrdralarMapChainTest.tscn 2>&1 | tee "/tmp/map_${ID}.log"
            STATUS=${PIPESTATUS[0]}
            set -e
            if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:' "/tmp/map_${ID}.log"; then
              exit 1
            fi
            if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
              exit "$STATUS"
            fi
          done

      - name: Assert scope remains internal
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq 'IZRDRALAR M01–M05 — PRODUCTION PASS 01' docs/CURRENT_STATE_WORLD_OF_XETHKIOZ.md
          grep -Fq 'Internal Development Build' docs/CURRENT_STATE_WORLD_OF_XETHKIOZ.md
          echo 'PRODUCTION SCOPE: PASS'
