name: World of Xethkioz Top-Down Pivot

on:
  workflow_dispatch:
  push:
    branches:
      - game/xethkioz-topdown-production

jobs:
  topdown-pivot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate top-down assets
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --quiet pillow
          python tools/generate_topdown_pivot_assets.py
          test -f assets/topdown/generated/izrdalar_node1_topdown.png
          test -f assets/topdown/generated/elida.png

      - name: Install Godot 4.7.2 and Windows templates
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Import and validate
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/import.log || true
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/import.log; then exit 1; fi
          "$GODOT" --headless --path . --check-only --script res://scripts/topdown_player.gd
          "$GODOT" --headless --path . --check-only --script res://scripts/topdown_enemy.gd
          "$GODOT" --headless --path . --check-only --script res://scripts/topdown_main.gd
          "$GODOT" --headless --path . --check-only --script res://tools/topdown_visual_smoke.gd

      - name: Runtime startup
        shell: bash
        run: |
          set -uo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          set +e
          timeout 12s "$GODOT" --headless --path . --quit-after 120 2>&1 | tee /tmp/runtime.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" /tmp/runtime.log; then exit 1; fi
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then exit "$STATUS"; fi

      - name: Capture actual pivot screens
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p build
          xvfb-run -a "$GODOT" --path . --rendering-method gl_compatibility --script res://tools/topdown_visual_smoke.gd
          test -f build/topdown_title.png
          test -f build/topdown_node1.png

      - name: Upload pivot previews
        uses: actions/upload-artifact@v4
        with:
          name: World-of-Xethkioz-TopDown-v0.1-Previews
          path: |
            build/topdown_title.png
            build/topdown_node1.png
          if-no-files-found: error

      - name: Export Windows x86_64
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p build
          "$GODOT" --headless --path . --export-release "Windows Desktop" build/Mundo_de_Xethkioz_TopDown.exe
          cd build
          zip -9 World_of_Xethkioz_TopDown_Pivot_v0.1_Windows.zip Mundo_de_Xethkioz_TopDown.exe

      - name: Upload Windows pivot
        uses: actions/upload-artifact@v4
        with:
          name: World-of-Xethkioz-TopDown-Pivot-v0.1-Windows
          path: build/World_of_Xethkioz_TopDown_Pivot_v0.1_Windows.zip
          if-no-files-found: error
