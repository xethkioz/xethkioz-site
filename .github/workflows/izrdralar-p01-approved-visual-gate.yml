name: Izrdralar P01 Approved Visual Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/production/characters/p01_approved/viajero_runtime_atlas.png'
      - 'src/player/viajero_approved_visual.gd'
      - 'src/player/player_controller_production.gd'
      - 'src/player/player_controller_production_pass02.gd'
      - 'tools/izrdralar_p01_approved_visual_smoke.gd'
      - 'tools/scenes/IzrdralarP01ApprovedVisualSmoke.tscn'
      - '.github/workflows/izrdralar-p01-approved-visual-gate.yml'

concurrency:
  group: izrdralar-p01-approved-visual-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  p01-approved-visual:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project and reject parser regressions
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/p01-approved-import.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/p01-approved-import.log; then
            exit 1
          fi

      - name: Validate approved P01 runtime visual
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarP01ApprovedVisualSmoke.tscn 2>&1 | tee /tmp/p01-approved-smoke.log
          grep -q "IZRDRALAR_P01_APPROVED_VISUAL_PASS" /tmp/p01-approved-smoke.log

      - name: Upload P01 approved visual logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izrdralar-p01-approved-visual-gate-logs
          path: |
            /tmp/p01-approved-import.log
            /tmp/p01-approved-smoke.log
          if-no-files-found: warn
