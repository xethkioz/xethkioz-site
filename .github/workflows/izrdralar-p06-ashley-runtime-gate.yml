name: Izrdralar P06 Ashley Runtime Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/npc/ashley_*.gd'
      - 'scenes/characters/P06AshleyRuntime.tscn'
      - 'tools/ashley_rhythm_dummy.gd'
      - 'tools/izrdralar_p06_ashley_runtime_smoke.gd'
      - 'tools/scenes/IzrdralarP06AshleyRuntimeSmoke.tscn'
      - 'docs/character_core/P06_ASHLEY_RUNTIME_CONTRACT.md'
      - '.github/workflows/izrdralar-p06-ashley-runtime-gate.yml'

concurrency:
  group: izrdralar-p06-ashley-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  p06-ashley:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project and reject parser regressions
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/p06-import.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/p06-import.log; then
            exit 1
          fi

      - name: Validate P06 Ashley rhythm runtime contract
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . res://tools/scenes/IzrdralarP06AshleyRuntimeSmoke.tscn 2>&1 | tee /tmp/p06-smoke.log
          grep -q "IZRDRALAR_P06_ASHLEY_RUNTIME_PASS" /tmp/p06-smoke.log

      - name: Upload P06 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izrdralar-p06-ashley-runtime-gate-logs
          path: |
            /tmp/p06-import.log
            /tmp/p06-smoke.log
          if-no-files-found: warn
