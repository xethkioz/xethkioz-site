<svg xmlns="http://www.w3.org/2000/svg" width="72" height="96" viewBox="0 0 72 96" shape-rendering="crispEdges">
<defs>
  <g id="shadow"><ellipse cx="12" cy="21" rx="9" ry="2.5" fill="#061018" opacity=".48"/></g>

  <g id="down">
    <use href="#shadow"/>
    <!-- tail aura behind body -->
    <path d="M18 15h5v3h-2v2h-5v-3h2z" fill="#d98cf2"/><rect x="21" y="13" width="3" height="3" fill="#7d5bd0"/><rect x="22" y="12" width="2" height="1" fill="#d8ceff"/>
    <!-- body -->
    <path d="M5 11h14v2h2v6h-3v2H6v-2H3v-6h2z" fill="#dff5ee"/>
    <rect x="7" y="13" width="10" height="6" fill="#f4fffb"/><rect x="5" y="16" width="3" height="3" fill="#b9e6da"/><rect x="16" y="16" width="3" height="3" fill="#b9e6da"/>
    <!-- ears / prism fins -->
    <path d="M6 11V5h2V2l3 4v5z" fill="#b9efe1"/><path d="M14 11V5h2V2l3 4v5z" fill="#b9efe1"/>
    <path d="M7 6l2-4 2 5H9zM15 6l2-4 2 5h-2z" fill="#7656c7"/><rect x="8" y="5" width="1" height="3" fill="#e7ddff"/><rect x="16" y="5" width="1" height="3" fill="#e7ddff"/>
    <!-- face -->
    <rect x="7" y="12" width="2" height="2" fill="#202c38"/><rect x="15" y="12" width="2" height="2" fill="#202c38"/>
    <rect x="11" y="15" width="3" height="2" fill="#f18445"/><rect x="12" y="14" width="1" height="1" fill="#ffd078"/>
    <!-- chest resonance mark -->
    <polygon points="12,17 14,19 12,21 10,19" fill="#7151c4"/><rect x="12" y="18" width="1" height="2" fill="#e1d6ff"/>
    <!-- paws -->
    <rect x="5" y="19" width="4" height="2" fill="#9fd6c9"/><rect x="15" y="19" width="4" height="2" fill="#9fd6c9"/>
  </g>

  <g id="side">
    <use href="#shadow"/>
    <!-- long prism tail -->
    <path d="M5 15H2v3h5v2h5v-3H8v-3H5z" fill="#d990f1"/><rect x="2" y="14" width="3" height="2" fill="#7958ca"/><rect x="1" y="13" width="2" height="2" fill="#d8ceff"/>
    <!-- body / shoulders -->
    <path d="M7 11h12l3 3v5h-3v2H8v-2H5v-5z" fill="#e4f8f2"/><rect x="9" y="13" width="11" height="6" fill="#f5fffc"/><rect x="7" y="17" width="4" height="3" fill="#b0dfd3"/>
    <!-- head -->
    <path d="M10 8h9v2h3v6h-3v2h-9z" fill="#f3fffb"/>
    <path d="M11 10V5h2V2l3 4v5z" fill="#b9efe1"/><path d="M12 6l2-4 2 5h-2z" fill="#7554c5"/><rect x="13" y="5" width="1" height="3" fill="#eee6ff"/>
    <rect x="17" y="11" width="2" height="2" fill="#202c38"/><rect x="20" y="14" width="3" height="2" fill="#f18445"/>
    <!-- side resonance stripe -->
    <rect x="12" y="16" width="5" height="2" fill="#6d50bd"/><rect x="14" y="16" width="1" height="2" fill="#dcd0ff"/>
    <!-- paws -->
    <rect x="9" y="19" width="4" height="2" fill="#9dd5c8"/><rect x="17" y="19" width="4" height="2" fill="#9dd5c8"/>
  </g>

  <g id="up">
    <use href="#shadow"/>
    <path d="M18 15h5v3h-2v2h-5v-3h2z" fill="#d98cf2"/><rect x="21" y="13" width="3" height="3" fill="#7d5bd0"/>
    <path d="M5 11h14v2h2v6h-3v2H6v-2H3v-6h2z" fill="#d8efe8"/>
    <rect x="7" y="13" width="10" height="6" fill="#e9f8f3"/>
    <path d="M6 11V5h2V2l3 4v5z" fill="#aee3d6"/><path d="M14 11V5h2V2l3 4v5z" fill="#aee3d6"/>
    <path d="M7 6l2-4 2 5H9zM15 6l2-4 2 5h-2z" fill="#7151c4"/>
    <!-- back resonance ridge -->
    <rect x="10" y="12" width="4" height="2" fill="#7656c7"/><rect x="11" y="14" width="2" height="4" fill="#9d83e7"/><rect x="12" y="14" width="1" height="3" fill="#e8e0ff"/>
    <rect x="5" y="19" width="4" height="2" fill="#97cfc2"/><rect x="15" y="19" width="4" height="2" fill="#97cfc2"/>
  </g>
</defs>

<!-- down walk -->
<g transform="translate(0 0)"><use href="#down"/><rect x="5" y="20" width="4" height="2" fill="#8ec7ba"/></g>
<g transform="translate(24 0)"><use href="#down"/></g>
<g transform="translate(48 0)"><use href="#down"/><rect x="15" y="20" width="4" height="2" fill="#8ec7ba"/></g>

<!-- left walk -->
<g transform="translate(0 24)"><use href="#side"/><rect x="8" y="20" width="4" height="2" fill="#8ec7ba"/></g>
<g transform="translate(24 24)"><use href="#side"/></g>
<g transform="translate(48 24)"><use href="#side"/><rect x="17" y="20" width="4" height="2" fill="#8ec7ba"/></g>

<!-- right walk mirrored -->
<g transform="translate(24 48) scale(-1 1)"><use href="#side"/><rect x="8" y="20" width="4" height="2" fill="#8ec7ba"/></g>
<g transform="translate(48 48) scale(-1 1)"><use href="#side"/></g>
<g transform="translate(72 48) scale(-1 1)"><use href="#side"/><rect x="17" y="20" width="4" height="2" fill="#8ec7ba"/></g>

<!-- up walk -->
<g transform="translate(0 72)"><use href="#up"/><rect x="5" y="20" width="4" height="2" fill="#88c0b4"/></g>
<g transform="translate(24 72)"><use href="#up"/></g>
<g transform="translate(48 72)"><use href="#up"/><rect x="15" y="20" width="4" height="2" fill="#88c0b4"/></g>
</svg>