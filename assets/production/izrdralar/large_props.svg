<svg xmlns="http://www.w3.org/2000/svg" width="288" height="48" viewBox="0 0 288 48" shape-rendering="crispEdges">
<rect width="288" height="48" fill="none"/>

<!-- 0 native canopy tree: asymmetrical stepped canopy, lit crown, dark underside -->
<g transform="translate(0 0)">
  <!-- roots/trunk, deliberately shadow-free: runtime owns contact shadow -->
  <path d="M18 45h12l-2-18h-8z" fill="#4b3023"/>
  <rect x="20" y="27" width="6" height="16" fill="#6e472f"/>
  <rect x="20" y="28" width="2" height="13" fill="#8b5d3c"/>
  <rect x="26" y="29" width="2" height="12" fill="#34231c"/>
  <path d="M20 39l-10 6h10l4-3 4 3h10l-10-7z" fill="#3f291f"/>
  <rect x="12" y="42" width="8" height="2" fill="#5b3a29"/>
  <rect x="28" y="42" width="7" height="2" fill="#5b3a29"/>
  <!-- dark lower canopy -->
  <rect x="6" y="19" width="36" height="12" fill="#153526"/>
  <rect x="9" y="14" width="31" height="15" fill="#1b432d"/>
  <rect x="14" y="9" width="25" height="16" fill="#21553a"/>
  <rect x="20" y="5" width="16" height="13" fill="#2b6842"/>
  <rect x="7" y="17" width="8" height="10" fill="#205137"/>
  <rect x="34" y="13" width="8" height="13" fill="#173d2b"/>
  <!-- stepped silhouette cuts -->
  <rect x="6" y="19" width="3" height="4" fill="#193d2b"/>
  <rect x="39" y="20" width="4" height="5" fill="#102c20"/>
  <rect x="15" y="8" width="7" height="5" fill="#2e7248"/>
  <!-- upper-left highlights -->
  <rect x="20" y="6" width="9" height="3" fill="#4b8754"/>
  <rect x="12" y="14" width="7" height="3" fill="#3f7b4d"/>
  <rect x="29" y="10" width="6" height="2" fill="#3d7d4d"/>
  <rect x="10" y="22" width="5" height="2" fill="#2f6e45"/>
  <!-- temporal flecks -->
  <rect x="17" y="11" width="2" height="2" fill="#9c7cff"/>
  <rect x="36" y="16" width="2" height="1" fill="#8b5cf6"/>
  <rect x="31" y="23" width="1" height="2" fill="#54d6d2"/>
  <rect x="8" y="25" width="1" height="1" fill="#3fc7c9"/>
</g>

<!-- 1 ceibo: same ecosystem family, warmer flowering focal silhouette -->
<g transform="translate(48 0)">
  <path d="M18 45h12l-2-18h-8z" fill="#4b3020"/>
  <rect x="20" y="27" width="6" height="16" fill="#74492d"/>
  <rect x="20" y="28" width="2" height="12" fill="#95613b"/>
  <rect x="26" y="29" width="2" height="12" fill="#39251b"/>
  <path d="M20 39l-10 6h10l4-3 4 3h10l-10-7z" fill="#42291c"/>
  <rect x="7" y="19" width="35" height="12" fill="#163526"/>
  <rect x="10" y="14" width="30" height="15" fill="#1d482f"/>
  <rect x="15" y="9" width="24" height="16" fill="#245a39"/>
  <rect x="21" y="5" width="15" height="12" fill="#2f7045"/>
  <rect x="8" y="17" width="8" height="9" fill="#205038"/>
  <rect x="35" y="15" width="8" height="11" fill="#173b2a"/>
  <rect x="21" y="6" width="8" height="3" fill="#4d8653"/>
  <rect x="13" y="15" width="6" height="2" fill="#3c7649"/>
  <!-- flowers have dark mass + hot lit face -->
  <rect x="9" y="19" width="6" height="5" fill="#8d2632"/><rect x="10" y="18" width="4" height="3" fill="#e6535d"/><rect x="11" y="18" width="2" height="1" fill="#ff9a84"/>
  <rect x="18" y="9" width="7" height="5" fill="#922530"/><rect x="19" y="8" width="5" height="3" fill="#ef5a61"/><rect x="20" y="8" width="2" height="1" fill="#ffb08e"/>
  <rect x="30" y="10" width="7" height="5" fill="#922631"/><rect x="31" y="9" width="5" height="3" fill="#ee5861"/><rect x="32" y="9" width="2" height="1" fill="#ffad88"/>
  <rect x="35" y="21" width="7" height="5" fill="#86232f"/><rect x="36" y="20" width="5" height="3" fill="#de4d58"/>
  <rect x="22" y="22" width="7" height="5" fill="#922631"/><rect x="23" y="21" width="5" height="3" fill="#f06065"/>
  <!-- prism scar -->
  <rect x="27" y="29" width="2" height="3" fill="#6e50bd"/>
  <rect x="28" y="32" width="2" height="3" fill="#9c7cff"/>
  <rect x="27" y="35" width="1" height="2" fill="#d8ceff"/>
</g>

<!-- 2 resonant prism monolith: old-tech plinth, crystalline vertical mass -->
<g transform="translate(96 0)">
  <rect x="8" y="40" width="32" height="5" fill="#242a2c"/>
  <rect x="11" y="36" width="26" height="5" fill="#3e4748"/>
  <rect x="13" y="29" width="22" height="8" fill="#596364"/>
  <rect x="15" y="30" width="17" height="5" fill="#333b3d"/>
  <rect x="13" y="30" width="3" height="5" fill="#7d8585"/>
  <rect x="11" y="34" width="5" height="2" fill="#b66e42"/>
  <rect x="31" y="31" width="4" height="2" fill="#8c5b3c"/>
  <!-- crystal uses hard planar values -->
  <polygon points="24,1 36,15 32,32 24,38 14,31 12,16" fill="#4c358c"/>
  <polygon points="24,2 28,15 25,34 18,30 15,16" fill="#7453c5"/>
  <polygon points="24,2 33,15 29,23 25,14" fill="#a98cf0"/>
  <polygon points="22,5 26,14 23,26 18,29 16,17" fill="#c2aff7"/>
  <polygon points="23,5 26,12 23,17 20,10" fill="#f0ebff"/>
  <!-- cyan fracture-growth -->
  <polygon points="14,25 9,32 12,39 18,31" fill="#248e95"/>
  <polygon points="13,27 11,32 13,35 16,30" fill="#61d8d7"/>
  <rect x="8" y="20" width="2" height="2" fill="#d8ceff"/>
  <rect x="38" y="13" width="1" height="4" fill="#4bd8d4"/>
  <rect x="36" y="25" width="2" height="2" fill="#9c7cff"/>
  <rect x="13" y="41" width="22" height="1" fill="#8b5cf6" opacity=".75"/>
</g>

<!-- 3 living ruin pillar: broken top, front-lit stone, root/vine takeover -->
<g transform="translate(144 0)">
  <!-- broken stepped cap -->
  <rect x="10" y="8" width="29" height="6" fill="#555d5e"/>
  <rect x="13" y="5" width="20" height="4" fill="#727b7b"/>
  <rect x="18" y="3" width="11" height="3" fill="#8d9694"/>
  <rect x="34" y="6" width="5" height="5" fill="#3f4546"/>
  <!-- shaft -->
  <rect x="13" y="13" width="23" height="29" fill="#42494a"/>
  <rect x="16" y="13" width="15" height="27" fill="#687171"/>
  <rect x="17" y="14" width="4" height="24" fill="#838b89"/>
  <rect x="31" y="14" width="5" height="25" fill="#343a3b"/>
  <rect x="10" y="39" width="29" height="5" fill="#33393a"/>
  <rect x="14" y="38" width="21" height="3" fill="#596161"/>
  <!-- copper future-tech seam -->
  <rect x="27" y="14" width="3" height="13" fill="#5d4031"/>
  <rect x="28" y="15" width="1" height="10" fill="#d18752"/>
  <!-- fracture -->
  <path d="M20 17l5 4-4 6 6 4-5 8" fill="none" stroke="#252b2c" stroke-width="2"/>
  <path d="M31 24l4 5-3 8" fill="none" stroke="#7453c5" stroke-width="2"/>
  <rect x="31" y="29" width="2" height="2" fill="#d8ceff"/>
  <!-- roots/vines create lower 2.5D base -->
  <path d="M15 29c-6 2-7 8-9 15M34 22c7 4 5 12 9 17" fill="none" stroke="#28553a" stroke-width="2"/>
  <rect x="5" y="40" width="6" height="3" fill="#376f45"/>
  <rect x="38" y="37" width="6" height="4" fill="#3f7b49"/>
  <rect x="7" y="38" width="3" height="2" fill="#548e57"/>
</g>

<!-- 4 rock cluster: hard faceted planes, moss, prism seam -->
<g transform="translate(192 0)">
  <polygon points="4,43 8,29 17,20 25,24 29,42" fill="#3f4749"/>
  <polygon points="16,43 22,23 34,21 43,34 42,43" fill="#555e60"/>
  <!-- top-left lit facets -->
  <polygon points="9,29 17,21 22,25 17,32 7,35" fill="#798284"/>
  <polygon points="23,24 33,22 39,28 31,32 22,31" fill="#8c9596"/>
  <polygon points="8,35 17,32 16,42 5,42" fill="#515a5b"/>
  <!-- right/lower facets -->
  <polygon points="31,32 39,28 43,35 41,43 32,43" fill="#343b3d"/>
  <polygon points="17,32 24,29 31,33 28,43 16,43" fill="#4b5355"/>
  <!-- prism seam -->
  <polygon points="22,27 25,24 28,31 25,39 22,34" fill="#6245ad"/>
  <polygon points="24,28 25,26 26,31 24,36" fill="#d7c7ff"/>
  <rect x="24" y="38" width="2" height="2" fill="#8b5cf6"/>
  <!-- moss wraps upper-left, not base-shadow -->
  <path d="M8 33c5-3 8 0 12-3l3 2" fill="none" stroke="#3d7047" stroke-width="2"/>
  <rect x="7" y="34" width="6" height="3" fill="#4d8050"/>
  <rect x="34" y="35" width="6" height="3" fill="#466f47"/>
  <rect x="11" y="31" width="4" height="2" fill="#62915c"/>
</g>

<!-- 5 wetland reeds: layered depth bands, cattails, cyan resonance spores -->
<g transform="translate(240 0)">
  <!-- dark back reeds -->
  <g stroke="#285238" stroke-width="2">
    <path d="M7 45l4-25M14 45l1-31M22 45l4-30M31 45l-1-34M40 45l1-25"/>
  </g>
  <!-- mid green blades -->
  <g stroke="#477a48" stroke-width="2">
    <path d="M10 45l7-19M18 45l0-25M26 45l-5-21M34 45l-6-20M39 45l-3-16"/>
  </g>
  <!-- foreground base, stepped not oval -->
  <path d="M4 45l5-7 5 3 5-8 5 7 6-6 5 6 5-5 4 10z" fill="#234f35"/>
  <rect x="6" y="42" width="36" height="4" fill="#2d6540"/>
  <rect x="10" y="39" width="7" height="4" fill="#3f7a49"/>
  <rect x="28" y="38" width="8" height="5" fill="#3b7246"/>
  <!-- cattails -->
  <rect x="10" y="15" width="4" height="8" fill="#67472f"/><rect x="11" y="14" width="3" height="5" fill="#9b7048"/>
  <rect x="14" y="10" width="4" height="9" fill="#65452e"/><rect x="15" y="9" width="3" height="5" fill="#a2774e"/>
  <rect x="28" y="8" width="4" height="9" fill="#62432d"/><rect x="29" y="7" width="3" height="5" fill="#a1794f"/>
  <rect x="38" y="16" width="4" height="8" fill="#61422c"/><rect x="39" y="15" width="3" height="5" fill="#977047"/>
  <!-- resonance spores -->
  <rect x="5" y="27" width="2" height="2" fill="#6fe1d7"/>
  <rect x="22" y="20" width="2" height="2" fill="#7de8df"/>
  <rect x="42" y="28" width="1" height="1" fill="#3fc7c9"/>
  <rect x="19" y="12" width="1" height="2" fill="#bca7ff"/>
  <rect x="35" y="23" width="1" height="2" fill="#9c7cff"/>
</g>
</svg>